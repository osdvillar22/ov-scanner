name: Basket entry check (crypto + PSE)

# Crypto basket picks (Kraken, real-time) and PSE picks during the PSE
# session (TradingView intraday). Forex/metals/indices/energy picks are
# checked by the hourly scan (Yahoo data is delayed anyway).
#
# The 5-minute cadence comes from an external timer (cron-job.org) calling
# workflow_dispatch: GitHub throttles frequent schedules, and a */5 cron
# was really running every 11-14 min. The schedule below is only a backup
# in case that timer stops. Extra runs are harmless — alerts are deduped.
on:
  workflow_dispatch: {}
  schedule:
    - cron: '7-59/15 * * * *'

permissions:
  contents: write   # auto-removes dropped picks from basket.json

# Never run two checks at once (they'd race on the alert history), and
# never cancel one mid-run.
concurrency:
  group: basket
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Many runs have nothing to do (e.g. only PSE picks, market closed) —
      # skip the Python setup entirely then. Mirrors basket.pse_session_open.
      - name: Anything to check?
        id: picks
        run: |
          if python3 -c '
          import json, sys
          from datetime import datetime
          from zoneinfo import ZoneInfo
          m = datetime.now(ZoneInfo("Asia/Manila"))
          pse_open = m.weekday() < 5 and "09:30" <= m.strftime("%H:%M") <= "15:30"
          picks = json.load(open("basket.json"))["picks"]
          sys.exit(0 if any(p["asset_class"] == "crypto" or (p["asset_class"] == "pse" and pse_open) for p in picks) else 1)
          '; then
            echo "has_crypto=true" >> "$GITHUB_OUTPUT"
          else
            echo "No crypto picks, and no PSE picks during the PSE session — nothing to check."
          fi

      - name: Set up Python
        if: steps.picks.outputs.has_crypto == 'true'
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        if: steps.picks.outputs.has_crypto == 'true'
        run: pip install -r requirements.txt

      - name: Restore alert history
        if: steps.picks.outputs.has_crypto == 'true'
        uses: actions/cache/restore@v6
        with:
          path: basket_alerts_crypto.json
          key: basket-crypto-${{ github.run_id }}
          restore-keys: |
            basket-crypto-

      - name: Check basket
        id: check
        if: steps.picks.outputs.has_crypto == 'true'
        env:
          DISCORD_ENTRY_WEBHOOK_URL: ${{ secrets.DISCORD_ENTRY_WEBHOOK_URL }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          before=$(sha1sum basket_alerts_crypto.json 2>/dev/null || true)
          python basket.py --live
          after=$(sha1sum basket_alerts_crypto.json 2>/dev/null || true)
          [ "$before" != "$after" ] && echo "changed=true" >> "$GITHUB_OUTPUT" || true

      # Only when an alert went out or a pick was dropped — not every run.
      - name: Save alert history
        if: steps.check.outputs.changed == 'true'
        uses: actions/cache/save@v6
        with:
          path: basket_alerts_crypto.json
          key: basket-crypto-${{ github.run_id }}
