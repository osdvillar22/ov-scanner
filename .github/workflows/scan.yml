name: Scan and publish dashboard

on:
  schedule:
    - cron: '0 * * * *'  # every hour, on the hour
  workflow_dispatch: {}   # lets you trigger a run manually from the Actions tab

permissions:
  contents: read
  pages: write
  id-token: write

# Only one Pages deployment at a time; never cancel a run that's mid-scan.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      # state.json isn't committed to git (see .gitignore — it's 8MB+ with
      # candle history and churns every run). It's carried between scheduled
      # runs via the Actions cache instead: restore-keys picks up the most
      # recent previous run's entry, then we save a fresh one after.
      - name: Restore scanner state
        uses: actions/cache/restore@v4
        with:
          path: state.json
          key: scanner-state-${{ github.run_id }}
          restore-keys: |
            scanner-state-

      - name: Run scanner
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python scan.py

      - name: Save scanner state
        uses: actions/cache/save@v4
        with:
          path: state.json
          key: scanner-state-${{ github.run_id }}

      - name: Prepare Pages site
        run: |
          mkdir -p _site
          cp dashboard.html _site/
          cp data.json _site/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: scan
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
