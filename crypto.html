<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OV MARKETS</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%2314140F'/%3E%3Ccircle cx='10' cy='16' r='5.5' fill='none' stroke='%23E8CC66' stroke-width='3'/%3E%3Cpath d='M18.5 10.5l3.5 11 3.5-11' fill='none' stroke='%23E8CC66' stroke-width='3' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="ov.css">
<style>
  .nav { display: flex; gap: 14px; align-items: baseline; }
  .nav a { color: var(--ink-dim); text-decoration: none; font-size: 12px; }
  .nav a:hover { color: var(--ink); }
  .nav a.on { color: var(--ink); box-shadow: inset 0 -2px 0 var(--gold-bright); padding-bottom: 2px; }
  .up { color: var(--gain); } .down { color: var(--loss); }
  main { max-width: 1240px; margin: 0 auto; padding: 4px 16px 48px; }

  /* Controls: market on the left, view options on the right */
  .bar { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 14px; margin: 8px 0 20px; font-size: 12px; }
  .bar button { color: var(--ink-faint); }
  .bar button.on { color: var(--ink); }
  .bar .mkt.on { box-shadow: inset 0 -2px 0 var(--gold-bright); padding-bottom: 2px; }
  .bar .sp { flex: 1; }
  .bar .opt { font-size: 11px; }
  .bar .sep { width: 1px; height: 11px; background: var(--border); align-self: center; }

  /* The headline: the market's move, then one sentence */
  .hero { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 14px; }
  .hero .k { font-size: 13px; color: var(--ink-dim); }
  .hero .n { font-size: 34px; font-weight: 600; letter-spacing: -0.02em; line-height: 1.1; }
  .hero .s { font-size: 12px; color: var(--ink-dim); }
  .read { color: var(--ink-dim); margin: 6px 0 4px; font-size: 12px; line-height: 1.6; }
  .read b { color: var(--ink); font-weight: 500; }
  .uxline { font-size: 11px; color: var(--ink-dim); margin: 2px 0 0; }
  .uxline a { color: var(--violet); text-decoration: none; margin-right: 10px; white-space: nowrap; }
  .uxline a:hover { text-decoration: underline; }

  /* One table: name · move · tape · today · up/down */
  .tbl { margin-top: 18px; display: grid; grid-template-columns: 196px 100px minmax(0, 1fr) 86px 126px; align-items: stretch; }
  .tbl > .h { color: var(--ink-faint); font-size: 10px; letter-spacing: 0.08em; padding: 0 16px 6px 0; border-bottom: 1px solid var(--border); }
  .tbl > .c { padding: 8px 16px 8px 0; border-bottom: 1px solid var(--hair); min-width: 0; display: flex; flex-direction: column; justify-content: center; }
  .tbl > .br, .tbl > .brh { padding-right: 0; }
  .tbl > .c.hov { background: var(--surface); }
  .r { text-align: right; }
  .nm { display: block !important; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; cursor: pointer; align-content: center; }
  .nm .chev { display: inline-block; width: 12px; color: var(--ink-faint); }
  .nm a { color: var(--gold-bright); text-decoration: none; margin-left: 4px; }
  .ref .nm, .ref.mv { font-weight: 600; }
  .mv { text-align: right; font-weight: 600; font-variant-numeric: tabular-nums; }
  .mv small { display: block; font-weight: 400; font-size: 9.5px; color: var(--ink-faint); }
  .td { text-align: right; font-size: 11px; font-variant-numeric: tabular-nums; }
  .tape { display: grid; gap: 2px; height: 16px; }
  .tape i { display: block; border-radius: 2px; min-width: 0; }
  .tape i.now { outline: 1px solid var(--ink); outline-offset: 1px; }
  .tape i.none { background: var(--hair); }
  .tbl > .br { flex-direction: row; align-items: center; gap: 7px; font-size: 10px; color: var(--ink-faint); font-variant-numeric: tabular-nums; }
  .br .b { flex: 1; height: 4px; border-radius: 2px; background: var(--loss); overflow: hidden; }
  .br .b i { display: block; height: 100%; background: var(--gain); }
  .kids { grid-column: 1 / -1; padding: 6px 0 12px 12px; border-bottom: 1px solid var(--hair); display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 3px 22px; font-size: 11px; }
  .kids .k { display: flex; justify-content: space-between; gap: 8px; }
  .kids .w { color: var(--ink-dim); font-size: 10px; }
  .kids .t { color: var(--ink-faint); font-size: 10px; margin-left: 6px; }
  .kids .subh { grid-column: 1 / -1; color: var(--ink-faint); font-size: 9.5px; letter-spacing: 0.06em; margin-top: 6px; }
  .foot { display: flex; justify-content: space-between; flex-wrap: wrap; gap: 6px 16px; color: var(--ink-faint); font-size: 10.5px; margin-top: 10px; }
  .scale { display: flex; align-items: center; gap: 6px; }
  .scale i { width: 64px; height: 5px; border-radius: 2px; background: linear-gradient(90deg, var(--loss), var(--hair), var(--gain)); }
  .empty { color: var(--ink-dim); padding: 24px 0; }
  @media (max-width: 760px) {
    .tbl { grid-template-columns: 100px 72px minmax(0, 1fr) 58px; }
    .tbl > .c, .tbl > .h { padding-right: 10px; }
    .tbl > .h { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .nm a, .mv small { display: none; }
    .tbl > .br, .tbl > .h.brh { display: none; }
    .hero .n { font-size: 28px; }
    .bar .sp { flex-basis: 100%; height: 0; }
  }
</style>
</head>
<body>
  <header class="page">
    <div class="topbar">
      <span class="nav"><span class="brand">OV <span>SCANNER</span></span><a href="dashboard.html">dashboard</a><a href="forward.html">forward test</a><a class="on" href="crypto.html">markets</a></span>
      <span class="meta" id="meta">Loading…</span>
    </div>
  </header>
  <main>
    <div class="bar" id="bar">
      <button type="button" class="mkt" data-m="crypto">crypto</button><button type="button" class="mkt" data-m="pse">PSE</button>
      <span class="sp"></span>
      <button type="button" class="opt" data-tape="4h">4H tape</button><button type="button" class="opt" data-tape="d">daily tape</button>
      <span class="sep"></span>
      <button type="button" class="opt" data-w="med">median</button><button type="button" class="opt" data-w="vw" id="vwBtn">volume-wtd</button>
      <span class="sep"></span>
      <button type="button" class="opt" data-s="all" id="allBtn">all</button><button type="button" class="opt" data-s="large" id="largeBtn">large caps</button>
    </div>
    <div id="top"></div>
    <div class="tbl" id="tbl"><div class="empty">Loading…</div></div>
    <div class="foot"><span id="cap"></span><span class="scale" id="scale"></span></div>
  </main>
<script src="ov.js"></script>
<script>
let D = null;
const S = { market: 'crypto', weight: 'med', set: 'all', tape: '4h', open: new Set() };
try { Object.assign(S, JSON.parse(localStorage.getItem('ovs-markets') || '{}'), { open: new Set() }); } catch (e) {}
// crypto.html?m=pse opens the PSE tab.
const qm = new URLSearchParams(location.search).get('m');
if (qm === 'pse' || qm === 'crypto') S.market = qm;
const save = () => { try { localStorage.setItem('ovs-markets', JSON.stringify({ market: S.market, weight: S.weight, set: S.set, tape: S.tape })); } catch (e) {} };
const pct = (v) => v == null ? '—' : `${v > 0 ? '+' : v < 0 ? '−' : ''}${Math.abs(v).toFixed(2)}%`;
const cls = (v) => v > 0 ? 'up' : v < 0 ? 'down' : '';

// Words that differ between the two markets.
const WORDS = {
  crypto: { one: 'coin', many: 'coins', large: 'large caps', cat: 'category', cats: 'categories', vw: 'volume-wtd',
            today: "today = since 8:00 AM Manila (Kraken's daily candle)", day: 'day', days: 'days' },
  pse: { one: 'stock', many: 'stocks', large: 'PSEi 30', cat: 'sector', cats: 'sectors', vw: 'value-wtd',
         today: "today = against the previous session's close · index = PSE's own sector index", day: 'session', days: 'sessions' },
};

// Tape colour: loss / gain mixed into the page by size of the move
// (full colour at `scale` %).
const tint = (m, scale) => {
  const a = Math.min(1, Math.abs(m) / scale);
  return `color-mix(in srgb, var(--${m >= 0 ? 'gain' : 'loss'}) ${Math.round(18 + a * 82)}%, var(--hair))`;
};

function render() {
  const mk = D.market || 'crypto', W = WORDS[mk];
  const set = D.sets[S.set] || D.sets.all, mv = set.move || set.today, day = set.today, all = mv.ALL || {};
  const N = D.move_candles || 40, LB = D.history_lookback_days || 10;
  const REF = D.ref_key || 'BTC', REF_L = D.ref_label || 'BTC', ALL_L = D.all_label || 'all crypto';
  const IX = D.sector_index || {};
  const v = (s) => s ? s[S.weight] : null;
  const span = mk === 'pse' ? `${N / 2} sessions` : `${+(N * 4 / 24).toFixed(1)} days`;

  // Controls
  document.querySelectorAll('#bar [data-m]').forEach(b => b.classList.toggle('on', b.dataset.m === mk));
  document.querySelectorAll('#bar [data-tape]').forEach(b => b.classList.toggle('on', b.dataset.tape === S.tape));
  document.querySelectorAll('#bar [data-w]').forEach(b => b.classList.toggle('on', b.dataset.w === S.weight));
  document.querySelectorAll('#bar [data-s]').forEach(b => b.classList.toggle('on', b.dataset.s === S.set));
  document.getElementById('vwBtn').textContent = W.vw;
  document.getElementById('allBtn').textContent = `all ${W.many}`;
  document.getElementById('largeBtn').textContent = W.large;
  document.getElementById('largeBtn').disabled = !D.sets.large;
  document.getElementById('meta').innerHTML = `as of <strong>${fmtTime(D.generated_at)}</strong>`;

  // Headline: the reference (PSEi / BTC) for PSE, all crypto for crypto.
  const refs = D.ref_move || {}, refToday = D.ref || {};
  const heroKey = mk === 'pse' ? 'PSEi' : null;
  const heroMove = heroKey ? refs[heroKey] : v(all), heroToday = heroKey ? refToday[heroKey] : v(day.ALL);
  const cats = D.categories.filter(c => mv[c]).sort((a, b) => v(mv[b]) - v(mv[a]));
  const downN = cats.filter(c => v(mv[c]) < 0).length, upN = cats.length - downN;
  const best = cats[0], worst = cats[cats.length - 1];
  const lead = downN > upN
    ? `<b>Down in ${downN} of ${cats.length} ${W.cats}.</b> ${esc(worst)} leads the selling; ${esc(best)} ${v(mv[best]) >= 0 ? 'is the one up most' : 'holds up best'}.`
    : `<b>Up in ${upN} of ${cats.length} ${W.cats}.</b> ${esc(best)} leads; ${esc(worst)} ${v(mv[worst]) < 0 ? 'is down most' : 'lags'}.`;
  const others = mk === 'pse'
    ? `${esc(ALL_L)} ${pct(v(all))} · `
    : Object.entries(refs).map(([k, x]) => `${k} <span class="${cls(x)}">${pct(x)}</span>`).join(' · ') + ' · ';
  const ux = D.unusual || [];
  document.getElementById('top').innerHTML = `
    <div class="hero"><span class="k">${heroKey ? 'PSEi' : 'crypto'}</span><span class="n ${cls(heroMove)}">${pct(heroMove)}</span>
      <span class="s">over ${span} · <span class="${cls(heroToday)}">${pct(heroToday)}</span> today${D.ref_level ? ` · ${D.ref_level.toLocaleString(undefined, { minimumFractionDigits: 2 })}` : ''}</span></div>
    <div class="read">${lead} ${others}${all.up ?? 0} ${W.many} up, ${all.down ?? 0} down · watches <span class="up">▲${all.bull ?? 0}</span> <span class="down">▼${all.bear ?? 0}</span></div>
    ${ux.length ? `<div class="uxline">unusual volume today: ${ux.map(f => `<a href="dashboard.html?market=${mk}&q=${encodeURIComponent(f.name.split('/')[0])}" title="${f.x}× its usual volume, +${f.mv4}% in 4h · ${esc(f.cat || '')} · ${fmtTime(f.t)}">${esc(f.name.split('/')[0])} ${f.x}×</a>`).join('')}</div>` : ''}`;
  const uxCat = {};
  ux.forEach(f => { if (f.cat && (!uxCat[f.cat] || f.x > uxCat[f.cat].x)) uxCat[f.cat] = f; });
  const uxOf = {};
  ux.forEach(f => { uxOf[f.ticker] = f; });

  // Tape: 4H (the move at each 4H close) or daily (each close vs LB before).
  const cols = S.tape === 'd' ? set.days : (set.bars_4h || []);
  const scale = S.tape === 'd' ? 15 : 12;
  const colLabel = (c, i) => i === cols.length - 1 ? 'now'
    : S.tape === 'd' ? new Date(`${c.date}T00:00:00Z`).toLocaleDateString([], { month: 'short', day: 'numeric', timeZone: 'UTC' })
    : new Date(c.time).toLocaleString([], { month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' });
  const tape = (key) => `<span class="tape" style="grid-template-columns:repeat(${cols.length},minmax(0,1fr))">${cols.map((c, i) => {
    const m = v(c[key]), last = i === cols.length - 1 ? ' now' : '';
    return m == null ? `<i class="none${last}"></i>` : `<i class="${last.trim()}" style="background:${tint(m, scale)}" title="${colLabel(c, i)}: ${pct(m)}"></i>`;
  }).join('')}</span>`;

  // Rows
  const cm = (x) => set.move ? x.m : x.chg;
  const med = (a) => { if (!a.length) return null; const s = [...a].sort((x, y) => x - y), h = s.length >> 1; return s.length % 2 ? s[h] : (s[h - 1] + s[h]) / 2; };
  const coinCell = (x) => `<div class="k"><span>${esc(x.n.split('/')[0])}${uxOf[x.t] ? uxTag(uxOf[x.t]) : ''} ${x.w.length ? `<span class="w">${x.w.map(([tf, d]) => `<span class="${d === 'BULLISH' ? 'up' : 'down'}">${tf}${dirArrow(d)}</span>`).join(' ')}</span>` : ''}</span><span><span class="${cls(cm(x))}">${pct(cm(x))}</span><span class="t ${cls(x.chg)}" title="today">${pct(x.chg)}</span></span></div>`;
  const kids = (key) => {
    const list = D.coins.filter(x => x.c === key && (S.set === 'all' || x.l) && cm(x) != null).sort((a, b) => cm(b) - cm(a));
    if (mk !== 'pse') return list.map(coinCell).join('');
    const subs = {};
    list.forEach(x => (subs[x.s || key] = subs[x.s || key] || []).push(x));
    const many = Object.keys(subs).length > 1;
    return Object.entries(subs).sort((a, b) => med(b[1].map(cm)) - med(a[1].map(cm)))
      .map(([s, xs]) => `${many ? `<div class="subh">${esc(s.toUpperCase())} <span class="${cls(med(xs.map(cm)))}">${pct(med(xs.map(cm)))}</span> · ${xs.length}</div>` : ''}${xs.map(coinCell).join('')}`).join('');
  };
  const row = (key, label, ref) => {
    const s = mv[key];
    if (!s) return '';
    const m = v(s), t = v(day[key]), open = S.open.has(key), ix = IX[key];
    const ud = key === REF ? '' : `<span class="b"><i style="width:${s.n ? s.up / s.n * 100 : 0}%"></i></span>${s.up}/${s.down}`;
    const attrs = `data-k="${ref ? '' : esc(key)}"`;
    return `<div class="c nm ${ref ? 'ref' : ''}" ${attrs}>${ref ? '' : `<span class="chev">${open ? '▾' : '▸'}</span>`}${esc(label)}${ref ? '' : `<a href="dashboard.html?market=${mk}&cat=${encodeURIComponent(key)}" title="Open the dashboard filtered to ${esc(key)}">↗</a>`}${!ref && uxCat[key] ? uxTag(uxCat[key], uxCat[key].name.split('/')[0]) : ''}</div>
      <div class="c mv ${ref ? 'ref' : ''} ${cls(m)}" ${attrs}>${pct(m)}${ix ? `<small title="PSE's own ${esc(key)} index">index ${pct(ix.m)}</small>` : ''}</div>
      <div class="c" ${attrs}>${tape(key)}</div>
      <div class="c td ${cls(t)}" ${attrs}>${pct(t)}</div>
      <div class="c br" ${attrs}>${ud}</div>
      ${open ? `<div class="kids">${kids(key)}</div>` : ''}`;
  };
  const first = cols[0], tapeHead = !cols.length ? '' : S.tape === 'd'
    ? `LAST ${cols.length} ${W.days.toUpperCase()} → TODAY`
    : `LAST ${cols.length} × 4H → NOW`;
  document.getElementById('tbl').innerHTML = `
    <div class="h">${W.cat.toUpperCase()}</div><div class="h r">${N}×4H MOVE</div><div class="h">${tapeHead}</div><div class="h r">TODAY</div><div class="h brh">UP / DOWN</div>
    ${row(REF, REF_L, true)}${row('ALL', ALL_L, true)}${cats.map(c => row(c, c, false)).join('')}`;
  document.querySelectorAll('#tbl [data-k]').forEach(el => {
    const k = el.dataset.k;
    if (!k) return;
    el.addEventListener('click', (e) => {
      if (e.target.closest('a')) return;
      S.open.has(k) ? S.open.delete(k) : S.open.add(k); render();
    });
    el.addEventListener('mouseenter', () => document.querySelectorAll(`#tbl [data-k="${CSS.escape(k)}"]`).forEach(x => x.classList.add('hov')));
    el.addEventListener('mouseleave', () => document.querySelectorAll(`#tbl .hov`).forEach(x => x.classList.remove('hov')));
  });
  document.getElementById('cap').textContent = (S.tape === 'd'
    ? `Tape: each cell = that ${W.day}'s close against ${LB} ${W.days} before`
    : `Tape: each cell = the ${N}×4H move at that 4H close`) + ` · outlined = now · ${N}×4H move = price now against the close ${N} 4H candles back · ${W.today} · tap a ${W.cat} for its ${W.many}`;
  document.getElementById('scale').innerHTML = `−${scale}% <i></i> +${scale}%`;
}

// crypto.json / pse.json, written by the hourly scan.
function load(market) {
  S.market = market; S.open = new Set(); save();
  document.querySelectorAll('#bar [data-m]').forEach(b => b.classList.toggle('on', b.dataset.m === market));
  fetch(`${market}.json`, { cache: 'no-cache' })
    .then(r => { if (!r.ok) throw new Error(`HTTP ${r.status}`); return r.json(); })
    .then(d => { if (S.market === market) { D = d; render(); } })
    .catch(err => { document.getElementById('tbl').innerHTML = `<div class="empty">Couldn't load ${market}.json (${esc(err.message)}). It's written by the hourly scan.</div>`; });
}
document.querySelectorAll('#bar [data-m]').forEach(b => b.addEventListener('click', () => { if (b.dataset.m !== S.market) load(b.dataset.m); }));
document.querySelectorAll('#bar [data-tape]').forEach(b => b.addEventListener('click', () => { S.tape = b.dataset.tape; save(); render(); }));
document.querySelectorAll('#bar [data-w]').forEach(b => b.addEventListener('click', () => { S.weight = b.dataset.w; save(); render(); }));
document.querySelectorAll('#bar [data-s]').forEach(b => b.addEventListener('click', () => { if (!b.disabled) { S.set = b.dataset.s; save(); render(); } }));
load(S.market);
</script>
</body>
</html>
