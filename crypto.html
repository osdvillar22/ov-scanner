<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OV MARKETS</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%2314140F'/%3E%3Ccircle cx='10' cy='16' r='5.5' fill='none' stroke='%23E8CC66' stroke-width='3'/%3E%3Cpath d='M18.5 10.5l3.5 11 3.5-11' fill='none' stroke='%23E8CC66' stroke-width='3' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="ov.css">
<style>
  .nav { display: flex; gap: 14px; align-items: baseline; }
  .nav a { color: var(--ink-dim); text-decoration: none; font-size: 12px; }
  .nav a:hover { color: var(--ink); }
  .nav a.on { color: var(--ink); box-shadow: inset 0 -2px 0 var(--gold-bright); padding-bottom: 2px; }
  .up { color: var(--gain); } .down { color: var(--loss); }
  main { max-width: 1240px; margin: 0 auto; padding: 4px 16px 48px; }

  /* Controls: market on the left, view options on the right */
  .bar { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 14px; margin: 8px 0 20px; font-size: 12px; }
  .bar button { color: var(--ink-faint); }
  .bar button.on { color: var(--ink); }
  .bar .mkt.on { box-shadow: inset 0 -2px 0 var(--gold-bright); padding-bottom: 2px; }
  .bar .sp { flex: 1; }
  .bar .opt { font-size: 11px; }
  .bar .sep { width: 1px; height: 11px; background: var(--border); align-self: center; }

  /* The headline: the market's move, then one sentence */
  .hero { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 14px; }
  .hero .k { font-size: 13px; color: var(--ink-dim); }
  .hero .n { font-size: 34px; font-weight: 600; letter-spacing: -0.02em; line-height: 1.1; }
  .hero .s { font-size: 12px; color: var(--ink-dim); }
  .read { color: var(--ink-dim); margin: 6px 0 4px; font-size: 12px; line-height: 1.6; }
  .read b { color: var(--ink); font-weight: 500; }
  .uxline { font-size: 11px; color: var(--ink-dim); margin: 2px 0 0; }
  .uxline a { color: var(--violet); text-decoration: none; margin-right: 10px; white-space: nowrap; }
  .uxline a:hover { text-decoration: underline; }

  /* One table: name · move · tape · today · up/down */
  .tbl { margin-top: 18px; display: grid; grid-template-columns: 196px 100px minmax(0, 1fr) 86px 126px; align-items: stretch; }
  .tbl > .h { color: var(--ink-faint); font-size: 10px; letter-spacing: 0.08em; padding: 0 16px 6px 0; border-bottom: 1px solid var(--border); }
  .tbl > .c { padding: 8px 16px 8px 0; border-bottom: 1px solid var(--hair); min-width: 0; display: flex; flex-direction: column; justify-content: center; }
  .tbl > .br, .tbl > .brh { padding-right: 0; }
  .tbl > .c.hov { background: var(--surface); }
  .r { text-align: right; }
  .nm { display: block !important; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; cursor: pointer; align-content: center; }
  .nm .chev { display: inline-block; width: 12px; color: var(--ink-faint); }
  .nm a { color: var(--gold-bright); text-decoration: none; margin-left: 4px; }
  .ref .nm, .ref.mv { font-weight: 600; }
  .mv { text-align: right; font-weight: 600; font-variant-numeric: tabular-nums; }
  .mv small { display: block; font-weight: 400; font-size: 9.5px; color: var(--ink-faint); }
  .td { text-align: right; font-size: 11px; font-variant-numeric: tabular-nums; }
  .tape { display: grid; gap: 2px; height: 16px; }
  .tape i { display: block; border-radius: 2px; min-width: 0; }
  .tape i.now { outline: 1px solid var(--ink); outline-offset: 1px; }
  .tape i.none { background: var(--hair); }
  .tbl > .br { flex-direction: row; align-items: center; gap: 7px; font-size: 10px; color: var(--ink-faint); font-variant-numeric: tabular-nums; }
  .br .b { flex: 1; height: 4px; border-radius: 2px; background: var(--loss); overflow: hidden; }
  .br .b i { display: block; height: 100%; background: var(--gain); }
  .kids { grid-column: 1 / -1; padding: 6px 0 12px 12px; border-bottom: 1px solid var(--hair); display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 3px 22px; font-size: 11px; }
  .kids .k { display: flex; justify-content: space-between; gap: 8px; }
  .kids .w { color: var(--ink-dim); font-size: 10px; }
  .kids .t { color: var(--ink-faint); font-size: 10px; margin-left: 6px; }
  .kids .subh { grid-column: 1 / -1; color: var(--ink-faint); font-size: 9.5px; letter-spacing: 0.06em; margin-top: 6px; }
  .foot { display: flex; justify-content: space-between; flex-wrap: wrap; gap: 6px 16px; color: var(--ink-faint); font-size: 10.5px; margin-top: 10px; }
  /* Line view: each row's 40×4H move over the last 40 4H closes */
  .spark { display: block; width: 100%; height: 32px; overflow: visible; }
  .bigv { grid-column: 1 / -1; padding: 10px 0 6px; }
  .bv-h { display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; font-size: 11px; color: var(--ink-dim); margin-bottom: 6px; }
  .bv-h b { color: var(--ink); font-weight: 500; }
  .bv-plot { position: relative; height: 150px; margin-left: 40px; touch-action: pan-y; }
  .bv-plot svg { display: block; width: 100%; height: 100%; }
  .bv-y { position: absolute; left: -40px; width: 34px; text-align: right; font-size: 9.5px; color: var(--ink-faint); transform: translateY(-50%); }
  .bv-guide { position: absolute; top: 0; bottom: 0; width: 1px; background: var(--ink-faint); display: none; pointer-events: none; }
  .bv-x { display: flex; justify-content: space-between; margin-left: 40px; font-size: 9.5px; color: var(--ink-faint); margin-top: 3px; }
  .bv-read { font-size: 10.5px; color: var(--ink-dim); margin: 4px 0 0 40px; min-height: 1.4em; }
  .scale { display: flex; align-items: center; gap: 6px; }
  .scale i { width: 64px; height: 5px; border-radius: 2px; background: linear-gradient(90deg, var(--loss), var(--hair), var(--gain)); }
  .empty { color: var(--ink-dim); padding: 24px 0; }

  /* 1H bias panel (breadth.json): % of the 1H watchlist that's bullish,
     new watches over the last 24h / session, the running total, the ref */
  .bias:empty { display: none; }
  .bias { margin-top: 16px; border: 1px solid var(--border); border-radius: 6px; background: var(--surface); padding: 10px 14px 12px; }
  .bias .bh { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; flex-wrap: wrap; font-size: 11px; color: var(--ink-dim); }
  .bias .bh b { color: var(--ink); font-weight: 500; }
  .bias .bh button { font-size: 10.5px; color: var(--ink-faint); }
  .bias .bh button:hover { color: var(--ink); }
  .bias .top { display: flex; align-items: center; gap: 6px 14px; flex-wrap: wrap; margin-top: 8px; }
  .bias .pc { font-size: 26px; font-weight: 600; letter-spacing: -0.02em; line-height: 1; }
  .btag { font-size: 9.5px; font-weight: 600; letter-spacing: 0.06em; padding: 2px 6px; border-radius: 3px; white-space: nowrap; }
  .btag.up { background: color-mix(in srgb, var(--gain) 16%, transparent); }
  .btag.down { background: color-mix(in srgb, var(--loss) 16%, transparent); }
  .btag.mix { color: var(--ink-dim); background: var(--hair); }
  .bias .sub { font-size: 11px; color: var(--ink-dim); }
  .bias .gauge { position: relative; height: 5px; border-radius: 3px; margin: 10px 0 2px; max-width: 360px;
    background: linear-gradient(90deg, var(--loss) 0 20%, color-mix(in srgb, var(--loss) 35%, var(--hair)) 20% 40%, var(--hair) 40% 60%, color-mix(in srgb, var(--gain) 35%, var(--hair)) 60% 80%, var(--gain) 80% 100%); }
  .bias .gauge i { position: absolute; top: -4px; width: 2px; height: 13px; background: var(--ink); border-radius: 1px; }
  .bias .gk { display: flex; justify-content: space-between; max-width: 360px; font-size: 9px; color: var(--ink-faint); }
  .bias .lb { display: flex; justify-content: space-between; gap: 8px; font-size: 10px; color: var(--ink-faint); margin: 10px 0 2px; }
  .bias .plots { position: relative; margin-right: 44px; touch-action: pan-y; }
  .bias svg { display: block; width: 100%; overflow: visible; }
  .bias .ya { position: absolute; right: -44px; width: 40px; font-size: 9px; color: var(--ink-faint); transform: translateY(-50%); }
  .bias .guide { position: absolute; top: 0; bottom: 0; width: 1px; background: var(--ink-faint); display: none; pointer-events: none; }
  .bias .bx { display: flex; justify-content: space-between; margin-right: 44px; font-size: 9.5px; color: var(--ink-faint); margin-top: 3px; }
  .bias .rd { font-size: 10.5px; color: var(--ink-dim); min-height: 1.4em; margin-top: 4px; }
  .bias .key { font-size: 10px; color: var(--ink-faint); margin-top: 6px; line-height: 1.5; }
  @media (max-width: 760px) {
    .tbl { grid-template-columns: 100px 72px minmax(0, 1fr) 58px; }
    .tbl > .c, .tbl > .h { padding-right: 10px; }
    .tbl > .h { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .nm a, .mv small { display: none; }
    .tbl > .br, .tbl > .h.brh { display: none; }
    .hero .n { font-size: 28px; }
    .bar .sp { flex-basis: 100%; height: 0; }
  }
</style>
</head>
<body>
  <header class="page">
    <div class="topbar">
      <span class="nav"><span class="brand">OV <span>SCANNER</span></span><a href="dashboard.html">dashboard</a><a href="forward.html">forward test</a><a class="on" href="crypto.html">markets</a></span>
      <span class="meta" id="meta">Loading…</span>
    </div>
  </header>
  <main>
    <div class="bar" id="bar">
      <button type="button" class="mkt" data-m="crypto">crypto</button><button type="button" class="mkt" data-m="pse">PSE</button>
      <span class="sp"></span>
      <button type="button" class="opt" data-tape="line">line</button><button type="button" class="opt" data-tape="4h">4H tape</button><button type="button" class="opt" data-tape="d">daily tape</button>
      <span class="sep"></span>
      <button type="button" class="opt" data-w="med">median</button><button type="button" class="opt" data-w="vw" id="vwBtn">volume-wtd</button>
      <span class="sep"></span>
      <button type="button" class="opt" data-s="all" id="allBtn">all</button><button type="button" class="opt" data-s="large" id="largeBtn">large caps</button>
    </div>
    <div id="top"></div>
    <div class="bias" id="bias"></div>
    <div class="tbl" id="tbl"><div class="empty">Loading…</div></div>
    <div class="foot"><span id="cap"></span><span class="scale" id="scale"></span></div>
  </main>
<script src="ov.js"></script>
<script>
let D = null;
const S = { market: 'crypto', weight: 'med', set: 'all', tape: 'line', open: new Set() };
try {
  const saved = JSON.parse(localStorage.getItem('ovs-markets') || '{}');
  Object.assign(S, saved, { open: new Set() });
  if (!saved.v2) S.tape = 'line';   // the line view is new — show it once
} catch (e) {}
// crypto.html?m=pse opens the PSE tab.
const qm = new URLSearchParams(location.search).get('m');
if (qm === 'pse' || qm === 'crypto') S.market = qm;
const save = () => { try { localStorage.setItem('ovs-markets', JSON.stringify({ market: S.market, weight: S.weight, set: S.set, tape: S.tape, v2: true })); } catch (e) {} };
const pct = (v) => v == null ? '—' : `${v > 0 ? '+' : v < 0 ? '−' : ''}${Math.abs(v).toFixed(2)}%`;
const cls = (v) => v > 0 ? 'up' : v < 0 ? 'down' : '';

// Words that differ between the two markets.
const WORDS = {
  crypto: { one: 'coin', many: 'coins', large: 'large caps', cat: 'category', cats: 'categories', vw: 'volume-wtd',
            today: "today = since 8:00 AM Manila (Kraken's daily candle)", day: 'day', days: 'days' },
  pse: { one: 'stock', many: 'stocks', large: 'PSEi 30', cat: 'sector', cats: 'sectors', vw: 'value-wtd',
         today: "today = against the previous session's close · index = PSE's own sector index", day: 'session', days: 'sessions' },
};

// Tape colour: loss / gain mixed into the page by size of the move
// (full colour at `scale` %).
const tint = (m, scale) => {
  const a = Math.min(1, Math.abs(m) / scale);
  return `color-mix(in srgb, var(--${m >= 0 ? 'gain' : 'loss'}) ${Math.round(18 + a * 82)}%, var(--hair))`;
};

function render() {
  const mk = D.market || 'crypto', W = WORDS[mk];
  const set = D.sets[S.set] || D.sets.all, mv = set.move || set.today, day = set.today, all = mv.ALL || {};
  const N = D.move_candles || 40, LB = D.history_lookback_days || 10;
  const REF = D.ref_key || 'BTC', REF_L = D.ref_label || 'BTC', ALL_L = D.all_label || 'all crypto';
  const IX = D.sector_index || {};
  const v = (s) => s ? s[S.weight] : null;
  const span = mk === 'pse' ? `${N / 2} sessions` : `${+(N * 4 / 24).toFixed(1)} days`;

  // Controls
  document.querySelectorAll('#bar [data-m]').forEach(b => b.classList.toggle('on', b.dataset.m === mk));
  document.querySelectorAll('#bar [data-tape]').forEach(b => b.classList.toggle('on', b.dataset.tape === S.tape));
  document.querySelectorAll('#bar [data-w]').forEach(b => b.classList.toggle('on', b.dataset.w === S.weight));
  document.querySelectorAll('#bar [data-s]').forEach(b => b.classList.toggle('on', b.dataset.s === S.set));
  document.getElementById('vwBtn').textContent = W.vw;
  document.getElementById('allBtn').textContent = `all ${W.many}`;
  document.getElementById('largeBtn').textContent = W.large;
  document.getElementById('largeBtn').disabled = !D.sets.large;
  document.getElementById('meta').innerHTML = `as of <strong>${fmtTime(D.generated_at)}</strong>`;

  // Headline: the reference (PSEi / BTC) for PSE, all crypto for crypto.
  const refs = D.ref_move || {}, refToday = D.ref || {};
  const heroKey = mk === 'pse' ? 'PSEi' : null;
  const heroMove = heroKey ? refs[heroKey] : v(all), heroToday = heroKey ? refToday[heroKey] : v(day.ALL);
  const cats = D.categories.filter(c => mv[c]).sort((a, b) => v(mv[b]) - v(mv[a]));
  const downN = cats.filter(c => v(mv[c]) < 0).length, upN = cats.length - downN;
  const best = cats[0], worst = cats[cats.length - 1];
  const lead = downN > upN
    ? `<b>Down in ${downN} of ${cats.length} ${W.cats}.</b> ${esc(worst)} leads the selling; ${esc(best)} ${v(mv[best]) >= 0 ? 'is the one up most' : 'holds up best'}.`
    : `<b>Up in ${upN} of ${cats.length} ${W.cats}.</b> ${esc(best)} leads; ${esc(worst)} ${v(mv[worst]) < 0 ? 'is down most' : 'lags'}.`;
  const others = mk === 'pse'
    ? `${esc(ALL_L)} ${pct(v(all))} · `
    : Object.entries(refs).map(([k, x]) => `${k} <span class="${cls(x)}">${pct(x)}</span>`).join(' · ') + ' · ';
  const ux = D.unusual || [];
  document.getElementById('top').innerHTML = `
    <div class="hero"><span class="k">${heroKey ? 'PSEi' : 'crypto'}</span><span class="n ${cls(heroMove)}">${pct(heroMove)}</span>
      <span class="s">over ${span} · <span class="${cls(heroToday)}">${pct(heroToday)}</span> today${D.ref_level ? ` · ${D.ref_level.toLocaleString(undefined, { minimumFractionDigits: 2 })}` : ''}</span></div>
    <div class="read">${lead} ${others}${all.up ?? 0} ${W.many} up, ${all.down ?? 0} down · watches <span class="up">▲${all.bull ?? 0}</span> <span class="down">▼${all.bear ?? 0}</span>${(() => { const br = biasRows(mk); return br.length ? ` · 1H bias ${biasTag(br[br.length - 1].pct)}` : ''; })()}</div>
    ${ux.length ? `<div class="uxline">unusual volume today: ${ux.map(f => `<a href="dashboard.html?market=${mk}&q=${encodeURIComponent(f.name.split('/')[0])}" title="${f.x}× its usual volume, +${f.mv4}% in 4h · ${esc(f.cat || '')} · ${fmtTime(f.t)}">${esc(f.name.split('/')[0])} ${f.x}×</a>`).join('')}</div>` : ''}`;
  const uxCat = {};
  ux.forEach(f => { if (f.cat && (!uxCat[f.cat] || f.x > uxCat[f.cat].x)) uxCat[f.cat] = f; });
  const uxOf = {};
  ux.forEach(f => { uxOf[f.ticker] = f; });

  // Line: the 40×4H move at each of the last 40 4H closes, every row on
  // one scale. Tape: 4H (the last 25 of those) or daily (each close vs LB
  // before).
  const bars = set.bars_4h || [];
  const ser = (key) => bars.map(c => v(c[key]));
  // Scale from the typical range (90th percentile of every row's values,
  // up to the next 5%): a rare spike clips at the edge instead of
  // flattening every other line.
  const lineLim = (() => {
    const all = [REF, 'ALL', ...cats].flatMap(k => ser(k)).filter(x => x != null).map(Math.abs).sort((x, y) => x - y);
    const p90 = all.length ? all[Math.floor(all.length * 0.9)] : 0;
    return Math.max(5, Math.ceil(p90 / 5) * 5);
  })();
  const barTime = (c) => new Date(c.time).toLocaleString([], { month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' });
  // SVG body for a series on [-lim, lim]: zero line, green / red fill,
  // the line, and a dot on the latest point. Gaps carry the last value.
  const plot = (vals, w, h, lim, ref) => {
    let prev = 0;
    const vs = vals.map(x => (prev = x == null ? prev : x));
    const n = vs.length, y = (x) => h / 2 - Math.max(-lim, Math.min(lim, x)) / lim * (h / 2 - 2), xp = (i) => n < 2 ? 0 : i / (n - 1) * w;
    const area = (pos) => `<polygon points="0,${y(0)} ${vs.map((x, i) => `${xp(i)},${y(pos ? Math.max(0, x) : Math.min(0, x))}`).join(' ')} ${w},${y(0)}" fill="var(--${pos ? 'gain' : 'loss'})" fill-opacity="0.25"/>`;
    const last = vs[n - 1];
    return `<line x1="0" x2="${w}" y1="${y(0)}" y2="${y(0)}" stroke="var(--ink-faint)" stroke-dasharray="2 3" stroke-width="1" vector-effect="non-scaling-stroke"/>`
      + area(true) + area(false)
      + (ref ? `<polyline points="${ref.map((x, i) => `${xp(i)},${y(x == null ? 0 : x)}`).join(' ')}" fill="none" stroke="var(--ink-dim)" stroke-width="1.2" stroke-dasharray="4 3" vector-effect="non-scaling-stroke"/>` : '')
      + `<polyline points="${vs.map((x, i) => `${xp(i)},${y(x)}`).join(' ')}" fill="none" stroke="var(--${last >= 0 ? 'gain' : 'loss'})" stroke-width="1.5" vector-effect="non-scaling-stroke"/>`
      + `<line x1="${xp(n - 1)}" x2="${xp(n - 1)}" y1="${y(last)}" y2="${y(last)}" stroke="var(--ink)" stroke-width="5" stroke-linecap="round" vector-effect="non-scaling-stroke"/>`;
  };
  const spark = (key) => {
    const vals = ser(key);
    if (!vals.some(x => x != null)) return '';
    return `<svg class="spark" viewBox="0 0 400 32" preserveAspectRatio="none"><title>${N}×4H move over the last ${bars.length} × 4H · now ${pct(vals[vals.length - 1])}</title>${plot(vals, 400, 32, lineLim)}</svg>`;
  };
  // Larger view of an opened row: its line against the reference, the
  // last zero cross, and a hover readout.
  const bigView = (key, label) => {
    const vals = ser(key), ref = key === REF ? null : ser(REF);
    if (!vals.some(x => x != null)) return '';
    let cross = '';
    for (let i = vals.length - 1; i > 0; i--) {
      const a = vals[i - 1], b = vals[i];
      if (a != null && b != null && (a < 0) !== (b < 0)) { cross = `crossed ${b >= 0 ? 'above' : 'below'} 0 · ${barTime(bars[i])}`; break; }
    }
    if (!cross) cross = `${vals[vals.length - 1] >= 0 ? 'above' : 'below'} 0 the whole time`;
    const ys = [lineLim, lineLim / 2, 0, -lineLim / 2, -lineLim];
    return `<div class="bigv" data-big="${esc(key)}">
      <div class="bv-h"><span><b>${esc(label)}</b>${ref ? ` vs <span style="border-bottom:1px dashed var(--ink-dim)">${esc(REF_L)}</span>` : ''} · ${N}×4H move, last ${bars.length} × 4H</span><span>${cross}</span></div>
      <div class="bv-plot"><svg viewBox="0 0 600 150" preserveAspectRatio="none">${plot(vals, 600, 150, lineLim, ref)}</svg>
        ${ys.map(t => `<span class="bv-y" style="top:${(1 - (t + lineLim) / (2 * lineLim)) * 100}%">${t > 0 ? '+' : t < 0 ? '−' : ''}${Math.abs(t)}%</span>`).join('')}
        <span class="bv-guide"></span></div>
      <div class="bv-x"><span>${bars.length ? barTime(bars[0]) : ''}</span><span>${bars.length ? barTime(bars[bars.length >> 1]) : ''}</span><span>now</span></div>
      <div class="bv-read">hover the line for values</div>
    </div>`;
  };
  const cols = S.tape === 'd' ? set.days : bars.slice(-25);
  const scale = S.tape === 'd' ? 15 : 12;
  const colLabel = (c, i) => i === cols.length - 1 ? 'now'
    : S.tape === 'd' ? new Date(`${c.date}T00:00:00Z`).toLocaleDateString([], { month: 'short', day: 'numeric', timeZone: 'UTC' })
    : new Date(c.time).toLocaleString([], { month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' });
  const tape = (key) => `<span class="tape" style="grid-template-columns:repeat(${cols.length},minmax(0,1fr))">${cols.map((c, i) => {
    const m = v(c[key]), last = i === cols.length - 1 ? ' now' : '';
    return m == null ? `<i class="none${last}"></i>` : `<i class="${last.trim()}" style="background:${tint(m, scale)}" title="${colLabel(c, i)}: ${pct(m)}"></i>`;
  }).join('')}</span>`;

  // Rows
  const cm = (x) => set.move ? x.m : x.chg;
  const med = (a) => { if (!a.length) return null; const s = [...a].sort((x, y) => x - y), h = s.length >> 1; return s.length % 2 ? s[h] : (s[h - 1] + s[h]) / 2; };
  const coinCell = (x) => `<div class="k"><span>${esc(x.n.split('/')[0])}${uxOf[x.t] ? uxTag(uxOf[x.t]) : ''} ${x.w.length ? `<span class="w">${x.w.map(([tf, d]) => `<span class="${d === 'BULLISH' ? 'up' : 'down'}">${tf}${dirArrow(d)}</span>`).join(' ')}</span>` : ''}</span><span><span class="${cls(cm(x))}">${pct(cm(x))}</span><span class="t ${cls(x.chg)}" title="today">${pct(x.chg)}</span></span></div>`;
  const kids = (key) => {
    const list = D.coins.filter(x => x.c === key && (S.set === 'all' || x.l) && cm(x) != null).sort((a, b) => cm(b) - cm(a));
    if (mk !== 'pse') return list.map(coinCell).join('');
    const subs = {};
    list.forEach(x => (subs[x.s || key] = subs[x.s || key] || []).push(x));
    const many = Object.keys(subs).length > 1;
    return Object.entries(subs).sort((a, b) => med(b[1].map(cm)) - med(a[1].map(cm)))
      .map(([s, xs]) => `${many ? `<div class="subh">${esc(s.toUpperCase())} <span class="${cls(med(xs.map(cm)))}">${pct(med(xs.map(cm)))}</span> · ${xs.length}</div>` : ''}${xs.map(coinCell).join('')}`).join('');
  };
  const row = (key, label, ref) => {
    const s = mv[key];
    if (!s) return '';
    const m = v(s), t = v(day[key]), open = S.open.has(key), ix = IX[key];
    const ud = key === REF ? '' : `<span class="b"><i style="width:${s.n ? s.up / s.n * 100 : 0}%"></i></span>${s.up}/${s.down}`;
    // Every row opens its larger line; categories / sectors also list
    // their coins / stocks.
    const attrs = `data-k="${esc(key)}"`;
    return `<div class="c nm ${ref ? 'ref' : ''}" ${attrs}><span class="chev">${open ? '▾' : '▸'}</span>${esc(label)}${ref ? '' : `<a href="dashboard.html?market=${mk}&cat=${encodeURIComponent(key)}" title="Open the dashboard filtered to ${esc(key)}">↗</a>`}${!ref && uxCat[key] ? uxTag(uxCat[key], uxCat[key].name.split('/')[0]) : ''}</div>
      <div class="c mv ${ref ? 'ref' : ''} ${cls(m)}" ${attrs}>${pct(m)}${ix ? `<small title="PSE's own ${esc(key)} index">index ${pct(ix.m)}</small>` : ''}</div>
      <div class="c" ${attrs}>${S.tape === 'line' ? spark(key) : tape(key)}</div>
      <div class="c td ${cls(t)}" ${attrs}>${pct(t)}</div>
      <div class="c br" ${attrs}>${ud}</div>
      ${open ? `${bigView(key, label)}${ref ? '' : `<div class="kids">${kids(key)}</div>`}` : ''}`;
  };
  const tapeHead = S.tape === 'line' ? (bars.length ? `${N}×4H MOVE · LAST ${bars.length} × 4H → NOW` : '')
    : !cols.length ? '' : S.tape === 'd' ? `LAST ${cols.length} ${W.days.toUpperCase()} → TODAY` : `LAST ${cols.length} × 4H → NOW`;
  document.getElementById('tbl').innerHTML = `
    <div class="h">${W.cat.toUpperCase()}</div><div class="h r">${N}×4H MOVE</div><div class="h">${tapeHead}</div><div class="h r">TODAY</div><div class="h brh">UP / DOWN</div>
    ${row(REF, REF_L, true)}${row('ALL', ALL_L, true)}${cats.map(c => row(c, c, false)).join('')}`;
  document.querySelectorAll('#tbl .bigv').forEach(bv => {
    const key = bv.dataset.big, vals = ser(key), ref = key === REF ? null : ser(REF);
    const plotEl = bv.querySelector('.bv-plot'), guide = bv.querySelector('.bv-guide'), read = bv.querySelector('.bv-read');
    plotEl.addEventListener('pointermove', (e) => {
      const r = plotEl.getBoundingClientRect(), i = Math.max(0, Math.min(bars.length - 1, Math.round((e.clientX - r.left) / r.width * (bars.length - 1))));
      guide.style.display = 'block'; guide.style.left = `${bars.length < 2 ? 0 : i / (bars.length - 1) * 100}%`;
      read.innerHTML = `${barTime(bars[i])}: <span class="${cls(vals[i])}">${pct(vals[i])}</span>${ref ? ` · ${esc(REF_L)} <span class="${cls(ref[i])}">${pct(ref[i])}</span>` : ''}`;
    });
    plotEl.addEventListener('pointerleave', () => { guide.style.display = 'none'; read.textContent = 'hover the line for values'; });
  });
  document.querySelectorAll('#tbl [data-k]').forEach(el => {
    const k = el.dataset.k;
    if (!k) return;
    el.addEventListener('click', (e) => {
      if (e.target.closest('a')) return;
      S.open.has(k) ? S.open.delete(k) : S.open.add(k); render();
    });
    el.addEventListener('mouseenter', () => document.querySelectorAll(`#tbl [data-k="${CSS.escape(k)}"]`).forEach(x => x.classList.add('hov')));
    el.addEventListener('mouseleave', () => document.querySelectorAll(`#tbl .hov`).forEach(x => x.classList.remove('hov')));
  });
  renderBias(mk);
  document.getElementById('cap').textContent = (S.tape === 'line'
    ? `Line: the ${N}×4H move at each 4H close, all rows on one scale · dotted = 0 · dot = now · tap a ${W.cat} for a larger view`
    : S.tape === 'd'
    ? `Tape: each cell = that ${W.day}'s close against ${LB} ${W.days} before · outlined = now`
    : `Tape: each cell = the ${N}×4H move at that 4H close · outlined = now`) + ` · ${N}×4H move = price now against the close ${N} 4H candles back · ${W.today} · tap a ${W.cat} for its ${W.many}`;
  document.getElementById('scale').innerHTML = S.tape === 'line' ? `shared scale ±${lineLim}%` : `−${scale}% <i></i> +${scale}%`;
}

// ---- 1H bias panel (breadth.json, breadth.py) ----
let B = null;
const BIAS_DAYS = 21;
const biasOf = (p) => p == null ? ['—', 'mix'] : p >= 80 ? ['STRONG BULL', 'up'] : p >= 60 ? ['BULL', 'up'] : p > 40 ? ['MIXED', 'mix'] : p > 20 ? ['BEAR', 'down'] : ['STRONG BEAR', 'down'];
const biasTag = (p) => { const [t, c] = biasOf(p); return `<span class="btag ${c}">${t}${p == null ? '' : ` ${p}%`}</span>`; };
const sgn = (v) => `${v > 0 ? '+' : v < 0 ? '−' : ''}${Math.abs(v).toLocaleString()}`;
// Rows for one market over the last BIAS_DAYS, with % bullish, the net
// of new watches over the window (24 rows crypto = 24h; 6 rows PSE = about
// one session) and the running total.
function biasRows(mk) {
  const all = (B && B[mk]) || [], win = mk === 'pse' ? 6 : 24;
  let cum = 0;
  const rows = all.map((r, i) => {
    cum += r.nu - r.nd;
    let net = 0;
    for (let j = Math.max(0, i - win + 1); j <= i; j++) net += all[j].nu - all[j].nd;
    return { ...r, pct: r.u + r.d ? Math.round(r.u / (r.u + r.d) * 100) : null, net, cum };
  });
  const from = Date.now() - BIAS_DAYS * 864e5;
  return rows.filter(r => parseTime(r.t) >= from);
}
function renderBias(mk) {
  const el = document.getElementById('bias');
  const rows = biasRows(mk);
  if (!rows.length) { el.innerHTML = ''; return; }
  let hidden = false;
  try { hidden = localStorage.getItem('ovs-bias-hidden') === '1'; } catch (e) {}
  const last = rows[rows.length - 1], n = rows.length, W = 600, ps = mk === 'pse';
  const refL = ps ? 'PSEi' : 'BTC', winL = ps ? 'last session' : 'last 24h';
  const [bt, bc] = biasOf(last.pct);
  const head = `<div class="bh"><span><b>1H bias</b> · from the 1H watchlist</span><button type="button" id="biasTog">${hidden ? 'show ▾' : 'hide ▴'}</button></div>`;
  const top = `<div class="top"><span class="pc ${bc === 'mix' ? '' : bc}">${last.pct ?? '—'}% bull</span><span class="btag ${bc}">${bt}</span>
    <span class="sub">on 1H watch now <span class="up">${last.u} up</span> · <span class="down">${last.d} down</span> · ${winL} new <span class="${cls(last.net)}">${sgn(last.net)}</span></span></div>`;
  if (hidden) { el.innerHTML = head + top; bindBias(mk); return; }
  const xp = (i) => n < 2 ? 0 : i / (n - 1) * W;
  // % bullish: bands above 80 / below 20, dotted 50, line coloured by band.
  const H1 = 110, y1 = (p) => H1 - p / 100 * H1;
  let segs = '';
  for (let i = 1; i < n; i++) {
    const a = rows[i - 1].pct, b = rows[i].pct;
    if (a == null || b == null) continue;
    const c = b >= 60 ? 'var(--gain)' : b <= 40 ? 'var(--loss)' : 'var(--ink-dim)';
    segs += `<line x1="${xp(i - 1)}" y1="${y1(a)}" x2="${xp(i)}" y2="${y1(b)}" stroke="${c}" stroke-width="1.6" vector-effect="non-scaling-stroke"/>`;
  }
  const pctSvg = `<svg viewBox="0 0 ${W} ${H1}" preserveAspectRatio="none" style="height:${H1}px">
    <rect x="0" y="0" width="${W}" height="${y1(80)}" fill="var(--gain)" fill-opacity="0.07"/>
    <rect x="0" y="${y1(20)}" width="${W}" height="${H1 - y1(20)}" fill="var(--loss)" fill-opacity="0.07"/>
    <line x1="0" x2="${W}" y1="${y1(50)}" y2="${y1(50)}" stroke="var(--ink-faint)" stroke-dasharray="3 3" vector-effect="non-scaling-stroke"/>${segs}</svg>`;
  // New watches over the window, up − down: bars around 0.
  const H2 = 56, lim2 = Math.max(5, ...rows.map(r => Math.abs(r.net))), y2 = (v) => H2 / 2 - v / lim2 * (H2 / 2 - 1), bw = W / n;
  const barSvg = `<svg viewBox="0 0 ${W} ${H2}" preserveAspectRatio="none" style="height:${H2}px">
    <line x1="0" x2="${W}" y1="${H2 / 2}" y2="${H2 / 2}" stroke="var(--ink-faint)" vector-effect="non-scaling-stroke"/>
    ${rows.map((r, i) => r.net ? `<rect x="${i * bw}" width="${Math.max(bw, 0.6)}" y="${Math.min(y2(r.net), H2 / 2)}" height="${Math.abs(y2(r.net) - H2 / 2)}" fill="var(--${r.net > 0 ? 'gain' : 'loss'})" fill-opacity="0.7"/>` : '').join('')}</svg>`;
  // Running total (slope only) and the reference price.
  const line = (vals, h, color) => {
    const v = vals.filter(x => x != null), lo = Math.min(...v), hi = Math.max(...v), sp = hi - lo || 1;
    let p = v[0];
    return `<svg viewBox="0 0 ${W} ${h}" preserveAspectRatio="none" style="height:${h}px"><polyline points="${vals.map((x, i) => `${xp(i)},${h - 2 - ((p = x ?? p) - lo) / sp * (h - 4)}`).join(' ')}" fill="none" stroke="${color}" stroke-width="1.3" vector-effect="non-scaling-stroke"/></svg>`;
  };
  const refs = rows.map(r => r.p), rv = refs.filter(x => x != null);
  const day = (r) => new Date(parseTime(r.t)).toLocaleDateString([], { month: 'short', day: 'numeric' });
  el.innerHTML = head + top + `
    <div class="gauge"><i style="left:calc(${last.pct ?? 50}% - 1px)"></i></div><div class="gk"><span>all short</span><span>50</span><span>all long</span></div>
    <div class="plots" id="biasPlots"><div class="guide" id="biasGuide"></div>
      <div class="lb"><span>% of the 1H watchlist that's bullish</span><span>dotted = 50</span></div>
      <div style="position:relative">${pctSvg}<span class="ya" style="top:0">100%</span><span class="ya" style="top:50%">50%</span><span class="ya" style="top:100%">0%</span></div>
      <div class="lb"><span>new watches, ${winL}: up − down</span><span>0 = as many new longs as shorts</span></div>
      <div style="position:relative">${barSvg}<span class="ya" style="top:0">+${lim2}</span><span class="ya" style="top:100%">−${lim2}</span></div>
      <div class="lb"><span>running total of new watches · read the slope, not the level</span></div>
      ${line(rows.map(r => r.cum), 110, 'var(--ink)')}
      <div class="lb"><span>${refL}</span></div>
      <div style="position:relative">${line(refs, 40, 'var(--ink-dim)')}${rv.length ? `<span class="ya" style="top:0">${Math.round(Math.max(...rv)).toLocaleString()}</span><span class="ya" style="top:100%">${Math.round(Math.min(...rv)).toLocaleString()}</span>` : ''}</div>
    </div>
    <div class="bx"><span>${day(rows[0])}</span><span>${day(rows[n >> 1])}</span><span>now</span></div>
    <div class="rd" id="biasRead">hover the charts for values</div>
    <div class="key">% bull: share of the live 1H setups (triggered within the last 25 hours, not broken) that are long · above 60 bull, below 40 bear, the shaded edges are one-sided markets · the bars turn before the % does · it shows which side the market is on now, not where it goes next</div>`;
  bindBias(mk, rows);
}
function bindBias(mk, rows) {
  document.getElementById('biasTog').addEventListener('click', () => {
    let h = false;
    try { h = localStorage.getItem('ovs-bias-hidden') === '1'; localStorage.setItem('ovs-bias-hidden', h ? '0' : '1'); } catch (e) {}
    renderBias(mk);
  });
  const plots = document.getElementById('biasPlots');
  if (!plots || !rows) return;
  const guide = document.getElementById('biasGuide'), read = document.getElementById('biasRead'), refL = mk === 'pse' ? 'PSEi' : 'BTC';
  const show = (e) => {
    const box = plots.getBoundingClientRect(), x = Math.max(0, Math.min(box.width, e.clientX - box.left));
    const i = Math.round(x / box.width * (rows.length - 1)), r = rows[i];
    guide.style.display = 'block'; guide.style.left = `${i / Math.max(1, rows.length - 1) * box.width}px`;
    read.innerHTML = `${fmtTime(r.t)} · <b>${r.pct ?? '—'}% bull</b> ${biasTag(r.pct)} · on watch <span class="up">${r.u}↑</span> <span class="down">${r.d}↓</span> · new ${mk === 'pse' ? 'session' : '24h'} <span class="${cls(r.net)}">${sgn(r.net)}</span>${r.p != null ? ` · ${refL} ${r.p.toLocaleString()}` : ''}`;
  };
  plots.addEventListener('pointermove', show);
  plots.addEventListener('pointerdown', show);
  plots.addEventListener('pointerleave', () => { guide.style.display = 'none'; read.textContent = 'hover the charts for values'; });
}
fetch('breadth.json', { cache: 'no-cache' }).then(r => r.ok ? r.json() : null).catch(() => null).then(d => { B = d; if (D) render(); });

// crypto.json / pse.json, written by the hourly scan.
function load(market) {
  S.market = market; S.open = new Set(); save();
  document.querySelectorAll('#bar [data-m]').forEach(b => b.classList.toggle('on', b.dataset.m === market));
  fetch(`${market}.json`, { cache: 'no-cache' })
    .then(r => { if (!r.ok) throw new Error(`HTTP ${r.status}`); return r.json(); })
    .then(d => { if (S.market === market) { D = d; render(); } })
    .catch(err => { document.getElementById('tbl').innerHTML = `<div class="empty">Couldn't load ${market}.json (${esc(err.message)}). It's written by the hourly scan.</div>`; });
}
document.querySelectorAll('#bar [data-m]').forEach(b => b.addEventListener('click', () => { if (b.dataset.m !== S.market) load(b.dataset.m); }));
document.querySelectorAll('#bar [data-tape]').forEach(b => b.addEventListener('click', () => { S.tape = b.dataset.tape; save(); render(); }));
document.querySelectorAll('#bar [data-w]').forEach(b => b.addEventListener('click', () => { S.weight = b.dataset.w; save(); render(); }));
document.querySelectorAll('#bar [data-s]').forEach(b => b.addEventListener('click', () => { if (!b.disabled) { S.set = b.dataset.s; save(); render(); } }));
load(S.market);
</script>
</body>
