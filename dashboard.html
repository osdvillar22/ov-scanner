<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OV Scanner</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/lightweight-charts@4.1.3/dist/lightweight-charts.standalone.production.js"></script>
<style>
  :root {
    --bg: #F5F3EC; --surface: #FFFFFF; --surface-raised: #F3F1E9; --border: #DEDACD; --hair: #E9E6DC;
    --ink: #1B1B16; --ink-dim: #6B6858; --ink-faint: #B8B4A2; --gain: #2F7A4F; --loss: #A8402C;
    --gold: #9C7A17; --gold-bright: #B8921C; --blue: #3E6FA8; --violet: #7A5CB8;
    --font-ui: 'IBM Plex Sans', -apple-system, sans-serif;
    --font-mono: 'IBM Plex Mono', ui-monospace, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #14140F; --surface: #1C1C15; --surface-raised: #24241B; --border: #34331F; --hair: #28271D;
      --ink: #EFEBDD; --ink-dim: #9B9782; --ink-faint: #55533F; --gain: #5FB980; --loss: #E27055;
      --gold: #D9B84A; --gold-bright: #E8CC66; --blue: #6FA8DC; --violet: #B39BE0;
    }
  }
  :root[data-theme="dark"] {
    --bg: #14140F; --surface: #1C1C15; --surface-raised: #24241B; --border: #34331F; --hair: #28271D;
    --ink: #EFEBDD; --ink-dim: #9B9782; --ink-faint: #55533F; --gain: #5FB980; --loss: #E27055;
    --gold: #D9B84A; --gold-bright: #E8CC66; --blue: #6FA8DC; --violet: #B39BE0;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: var(--bg); color: var(--ink); font-family: var(--font-mono); font-size: 12px; -webkit-font-smoothing: antialiased; }
  body { min-height: 100vh; }
  button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
  button:focus-visible, .opt:focus-visible { outline: 1px solid var(--gold-bright); outline-offset: 1px; }
  .is-hidden { display: none !important; }
  .bullish { color: var(--gain); } .bearish { color: var(--loss); }

  /* ---- Header: one line of title + scan info, one line of filters ---- */
  header.page { max-width: 1240px; margin: 0 auto; padding: 14px 16px 6px; }
  .topbar { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap; }
  .brand { font-size: 14px; font-weight: 600; letter-spacing: 0.02em; }
  .brand span { color: var(--gold-bright); }
  .meta { font-size: 11px; color: var(--ink-dim); }
  .meta strong { color: var(--ink); font-weight: 500; }
  .link-btn { color: var(--ink-dim); text-decoration: underline; text-underline-offset: 2px; }

  .filters { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 18px; margin-top: 10px; }
  .seg { display: flex; align-items: center; gap: 2px; flex-wrap: wrap; }
  .seg-label { font-size: 10.5px; color: var(--ink-faint); margin-right: 4px; }
  .opt { font-size: 11px; padding: 2px 7px; border-radius: 4px; color: var(--ink-dim); border: 1px solid transparent; }
  .opt:hover { color: var(--ink); }
  .opt.on { color: var(--ink); background: var(--surface-raised); border-color: var(--border); }
  .opt .n { color: var(--ink-faint); margin-left: 3px; }
  .opt.on .n { color: var(--ink-dim); }
  .sub-opt { font-size: 11px; padding: 2px 7px; border-radius: 4px; border: 1px dashed var(--border); color: var(--ink-dim); margin-left: 6px; }
  .sub-opt.on { border-style: solid; border-color: var(--gold-bright); color: var(--gold-bright); }

  .settings-panel { margin-top: 10px; padding: 10px 12px; background: var(--surface); border: 1px solid var(--border); border-radius: 6px; font-family: var(--font-ui); font-size: 12px; color: var(--ink-dim); line-height: 1.5; }
  .settings-panel strong { color: var(--ink); }
  .settings-panel code { font-family: var(--font-mono); background: var(--surface-raised); padding: 1px 5px; border-radius: 2px; }
  .settings-row { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 8px; align-items: center; }
  .settings-row input { flex: 1; min-width: 200px; font-family: var(--font-mono); font-size: 12px; padding: 5px 8px; background: var(--bg); color: var(--ink); border: 1px solid var(--border); border-radius: 4px; }
  .settings-msg { font-family: var(--font-mono); font-size: 11px; margin-top: 6px; min-height: 1em; }
  .text-btn { font-size: 11px; padding: 3px 9px; border: 1px solid var(--border); border-radius: 4px; color: var(--ink-dim); }
  .text-btn:hover { color: var(--ink); border-color: var(--ink-dim); }

  /* ---- Layout: charts left, watchlist/basket right (sticky) ---- */
  .layout { max-width: 1240px; margin: 0 auto; padding: 8px 16px 48px; display: flex; gap: 12px; align-items: flex-start; }
  .detail-panel { flex: 1; min-width: 0; background: var(--surface); border: 1px solid var(--border); border-radius: 6px; padding: 12px 14px; }
  .side-panel { order: 2; position: sticky; top: 10px; width: 272px; flex-shrink: 0; background: var(--surface); border: 1px solid var(--border); border-radius: 6px; overflow: hidden; }
  .panel-tabs { display: flex; border-bottom: 1px solid var(--border); }
  .panel-tab { flex: 1; font-size: 11px; color: var(--ink-dim); padding: 8px 6px; }
  .panel-tab.active { color: var(--ink); box-shadow: inset 0 -2px 0 var(--gold-bright); }
  .panel-tab .n { color: var(--ink-faint); margin-left: 3px; }
  .scroll { max-height: calc(100vh - 70px); overflow-y: auto; }

  /* ---- Watchlist rows: one line — name + RSI · timeframes · +/✓ ---- */
  .grp { font-size: 10px; letter-spacing: 0.08em; color: var(--ink-dim); padding: 6px 10px 3px; background: var(--surface-raised); display: flex; justify-content: space-between; }
  .grp .session { letter-spacing: 0; text-transform: none; }
  .grp .session.open { color: var(--gain); }
  .row { display: grid; grid-template-columns: minmax(0, 1fr) auto 18px; align-items: center; gap: 8px; padding: 6px 10px; border-bottom: 1px solid var(--hair); cursor: pointer; }
  .row:hover { background: var(--surface-raised); }
  .row.active { background: var(--surface-raised); box-shadow: inset 2px 0 0 var(--gold-bright); }
  .row-name { min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .sym { font-weight: 600; font-size: 12px; }
  .tag { font-size: 10px; color: var(--ink-dim); margin-left: 4px; }
  .rsi { font-size: 11px; margin-left: 6px; }
  .tfs { display: flex; gap: 7px; font-size: 11px; }
  .tfs .off { color: var(--ink-faint); }
  .tfs button { padding: 1px 0; opacity: 0.85; }
  .tfs button:hover { opacity: 1; }
  .tfs .shown { font-weight: 700; opacity: 1; }
  /* In the basket: gold underline under that timeframe. */
  .tfs .in-basket { text-decoration: underline; text-decoration-color: var(--gold-bright); text-decoration-thickness: 2px; text-underline-offset: 3px; }
  .plus { font-size: 14px; line-height: 1; color: var(--ink-faint); text-align: center; }
  .plus:hover { color: var(--gold-bright); }
  .plus.in { color: var(--gold-bright); }
  .plus:disabled { opacity: 0.4; cursor: wait; }

  /* ---- Basket cards: two lines, plain coloured text, tap a tf to mute ---- */
  .bk { padding: 7px 10px; border-bottom: 1px solid var(--hair); cursor: pointer; }
  .bk:hover { background: var(--surface-raised); }
  .bk.active { background: var(--surface-raised); box-shadow: inset 2px 0 0 var(--gold-bright); }
  .bk-head { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  .bk-htf { font-size: 11px; margin-left: 6px; }
  .bk-x { color: var(--ink-faint); font-size: 14px; line-height: 1; padding: 0 2px; }
  .bk-x:hover { color: var(--loss); }
  .bk-ltfs { display: flex; gap: 14px; flex-wrap: wrap; margin-top: 3px; font-size: 11px; }
  .sw { display: inline-flex; gap: 5px; }
  .sw .k { color: var(--ink-dim); }
  .sw.muted { opacity: 0.35; }
  .sw.muted .k { text-decoration: line-through; }
  .st-waiting, .st-pulled_back, .st-no_data, .st-pending { color: var(--ink-dim); }
  .st-armed { color: var(--gold-bright); }
  .st-entry { color: var(--gain); }
  .bk-note { font-size: 10.5px; color: var(--ink-dim); margin-top: 3px; }
  .bk-gone { font-size: 10.5px; color: var(--loss); margin-top: 3px; }
  .bk-msg { font-size: 10.5px; color: var(--loss); }
  .bk-msg:empty { display: none; }
  .empty { padding: 14px 12px; font-family: var(--font-ui); font-size: 12px; color: var(--ink-dim); line-height: 1.5; }
  .hint { padding: 7px 10px; font-size: 10.5px; color: var(--ink-faint); }

  /* ---- Asset header: one line + one summary line ---- */
  .d-top { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; flex-wrap: wrap; }
  .d-name { font-size: 15px; font-weight: 600; }
  .d-sub { font-size: 11px; color: var(--ink-dim); margin-left: 6px; font-weight: 400; }
  .d-right { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
  .tf-sw { font-size: 12px; padding: 1px 6px; border-radius: 4px; border: 1px solid transparent; }
  .tf-sw.off { color: var(--ink-faint); cursor: default; }
  .tf-sw.current { font-weight: 700; background: var(--surface-raised); border-color: var(--border); }
  .d-summary { font-size: 11px; color: var(--ink-dim); margin-top: 3px; }
  .d-actions { display: flex; align-items: center; gap: 10px; margin-top: 6px; font-size: 11px; }
  .bk-btn { color: var(--gold-bright); }
  .bk-btn.in { color: var(--ink-dim); }
  .bk-btn:disabled { opacity: 0.5; cursor: wait; }
  .msg { color: var(--ink-dim); }

  .legend { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; font-size: 10px; color: var(--ink-dim); margin: 10px 0 4px; }
  .legend .ln { display: inline-block; width: 9px; height: 0; border-top: 2px solid; vertical-align: middle; margin-right: 4px; }
  .legend .push { margin-left: auto; color: var(--ink-faint); }
  .chart-head { display: flex; justify-content: space-between; align-items: center; margin: 8px 0 4px; }
  .chart-label { font-size: 11px; font-weight: 600; }
  .chart-label .dim { color: var(--ink-dim); font-weight: 400; }
  .reset { font-size: 10px; color: var(--ink-faint); }
  .reset:hover { color: var(--ink); }
  .chart-box { width: 100%; height: 420px; position: relative; }
  .macd-box { width: 100%; height: 96px; margin-top: 2px; }
  .chart-placeholder { width: 100%; height: 160px; display: flex; align-items: center; justify-content: center; font-size: 11px; color: var(--ink-dim); background: var(--surface-raised); border: 1px dashed var(--border); border-radius: 4px; }
  .price-line { display: flex; justify-content: space-between; font-size: 12px; padding: 6px 0; margin-top: 4px; border-top: 1px solid var(--hair); border-bottom: 1px solid var(--hair); }
  .price-line .up { color: var(--gain); } .price-line .down { color: var(--loss); }
  .section { font-size: 10px; letter-spacing: 0.08em; color: var(--ink-dim); margin: 14px 0 2px; display: flex; gap: 12px; flex-wrap: wrap; }
  .section .cy { letter-spacing: 0; }

  .load-error { max-width: 1240px; margin: 40px auto; padding: 16px; font-family: var(--font-ui); color: var(--ink-dim); font-size: 12.5px; line-height: 1.6; background: var(--surface); border: 1px solid var(--border); border-radius: 6px; }
  .load-error code { font-family: var(--font-mono); background: var(--surface-raised); padding: 1px 5px; border-radius: 2px; }

  @media (max-width: 860px) {
    header.page { padding: 12px 12px 4px; }
    .layout { flex-direction: column; padding: 8px 12px 32px; }
    .side-panel { width: 100%; order: 0; position: static; }
    .scroll { max-height: 300px; }
    .detail-panel { padding: 10px; }
    .chart-box { height: 320px; }
    .macd-box { height: 80px; }
    .legend .push { display: none; }  /* ctrl+scroll hint — pinch is obvious on a phone */
  }
  @media (prefers-reduced-motion: reduce) { * { scroll-behavior: auto !important; } }
</style>
</head>
<body>

  <header class="page">
    <div class="topbar">
      <span class="brand">OV <span>Scanner</span></span>
      <span class="meta"><span id="scanMeta">Loading…</span> · <button class="link-btn" id="basketSettingsBtn" type="button">basket settings</button></span>
    </div>
    <div class="settings-panel is-hidden" id="basketSettings">
      <div><strong>Basket access.</strong> Adding and removing basket picks saves <code>basket.json</code> in your GitHub repo, which needs a token with access to this repo only. It's stored in this browser only — each device needs it once.</div>
      <div class="settings-row">
        <input type="password" id="tokenInput" placeholder="github_pat_…" autocomplete="off" spellcheck="false">
        <button class="text-btn" id="tokenSave" type="button">Save token</button>
        <button class="text-btn" id="tokenClear" type="button">Remove token</button>
      </div>
      <div class="settings-msg" id="tokenMsg"></div>
    </div>
    <div class="filters" id="filters">
      <div class="seg" data-group="market"><span class="seg-label">market</span></div>
      <div class="seg" data-group="tf"><span class="seg-label">tf</span></div>
      <div class="seg" data-group="dir"><span class="seg-label">dir</span></div>
    </div>
  </header>

  <div class="layout">
    <div class="side-panel">
      <div class="panel-tabs">
        <button class="panel-tab active" data-view="watchlist" type="button">watchlist<span class="n" id="wlCount"></span></button>
        <button class="panel-tab" data-view="basket" type="button">basket<span class="n" id="bkCount"></span></button>
      </div>
      <div class="scroll" id="watchlist"></div>
      <div class="scroll is-hidden" id="basketList"></div>
    </div>
    <div class="detail-panel" id="detail"></div>
  </div>

<script>
// ---------------------------------------------------------------------------
// Markets, timeframes, filters
// ---------------------------------------------------------------------------
const MARKETS = [
  ['all', 'all'], ['pse', 'PSE'], ['crypto', 'crypto'], ['forex', 'forex'],
  ['metals', 'metals'], ['indices', 'indices'], ['energy', 'energy'],
];
const GROUP_ORDER = ['pse', 'forex', 'metals', 'indices', 'energy', 'crypto'];
const GROUP_LABELS = { pse: 'PSE', forex: 'FOREX', metals: 'METALS', indices: 'INDICES', energy: 'ENERGY', crypto: 'CRYPTO' };
// Kraken's non-crypto pairs also count under their real market.
const TAG_MARKET = { currency: 'forex', gold: 'metals', uranium: 'energy' };
const marketsOf = (a) => new Set([a.asset_class, TAG_MARKET[a.tag]].filter(Boolean));

const TF_ORDER = ['1H', '4H', '1D'];          // the "aligned" set, every market
const tfsFor = (a) => a.asset_class === 'pse' ? ['1H', '4H', '1D', '1W'] : TF_ORDER;
const LOWER_TF_MAP = { '1H': ['15m', '5m'], '4H': ['1H', '15m'], '1D': ['4H', '1H'], '1W': ['1D', '4H'] };

const F = { market: 'all', large: false, tf: 'ALL', dir: 'ALL' };

// PSE session (Mon-Fri 9:30-15:00 Manila). Doesn't know PSE holidays.
function pseOpen() {
  const m = new Date(new Date().toLocaleString('en-US', { timeZone: 'Asia/Manila' }));
  const hm = m.getHours() * 60 + m.getMinutes();
  return m.getDay() >= 1 && m.getDay() <= 5 && hm >= 570 && hm < 900;
}

const dirClass = (d) => (d || '').toLowerCase();
const dirArrow = (d) => d === 'BULLISH' ? '▲' : '▼';
const symKey = (a) => `${a.asset_class}__${a.ticker}`;
const pickKey = (p) => `${p.asset_class}:${p.ticker}:${p.higher_tf}`;
const esc = (s) => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

let watchesBySym = {};     // symKey -> { '1H': watch, '4H': watch, ... }
let assetsById = {};       // watch _id -> watch
const isAligned = (byTf) => TF_ORDER.every(tf => byTf[tf]) && new Set(TF_ORDER.map(tf => byTf[tf].direction)).size === 1;

// Market filter for any asset-like object (a watch, or a basket pick with
// its watch's tag/large_cap when available).
function marketMatch(a) {
  if (F.market === 'all') return true;
  if (!marketsOf(a).has(F.market)) return false;
  return !(F.market === 'crypto' && F.large) || !!a.large_cap;
}

// scan.py ships candles as {fields, rows}; expand back to objects. Plain
// arrays are the older layout, still accepted.
function toCandles(c) {
  if (!c) return [];
  if (Array.isArray(c)) return c;
  return c.rows.map(r => Object.fromEntries(c.fields.map((f, i) => [f, r[i]])));
}
const toUnixTime = (iso) => iso ? Math.floor(new Date(iso).getTime() / 1000) : null;

// ---------------------------------------------------------------------------
// Charts
// ---------------------------------------------------------------------------
let activeCharts = [];     // { chart, el } so resizes match the right element
function teardownCharts() { activeCharts.forEach(c => { try { c.chart.remove(); } catch (e) {} }); activeCharts = []; }

const css = getComputedStyle(document.documentElement);
const cssVar = (name) => css.getPropertyValue(name).trim();
const RIGHT_GAP = 4;       // empty bars after the latest candle, off the price axis
const AXIS_WIDTH = 54;

const chartTheme = {
  layout: { background: { type: 'solid', color: 'transparent' }, textColor: cssVar('--ink-dim'), fontFamily: "'IBM Plex Mono', monospace", fontSize: 9 },
  grid: { vertLines: { visible: false }, horzLines: { visible: false } },
  rightPriceScale: { borderColor: cssVar('--border'), scaleMargins: { top: 0.1, bottom: 0.14 }, minimumWidth: AXIS_WIDTH },
  timeScale: { borderColor: cssVar('--border'), timeVisible: false, secondsVisible: false, fixLeftEdge: true, rightOffset: RIGHT_GAP },
  crosshair: { mode: 0 },
  // Drag to pan, pinch / drag the price axis to scale. The plain mouse
  // wheel is left to the page — Ctrl+wheel zooms (attachCtrlWheelZoom).
  handleScroll: { mouseWheel: false, pressedMouseMove: true, horzTouchDrag: true, vertTouchDrag: false },
  handleScale: { mouseWheel: false, pinch: true, axisPressedMouseMove: true, axisDoubleClickReset: true },
};
const followerInteraction = { handleScroll: false, handleScale: false };

function attachCtrlWheelZoom(chart, el, lastIndex) {
  const ts = chart.timeScale();
  // A new range only applies on the next paint, so fast wheel events
  // (trackpad pinch) build on the last range asked for, not a stale one.
  let pending = null;
  ts.subscribeVisibleLogicalRangeChange(() => { pending = null; });
  el.addEventListener('wheel', (e) => {
    if (!e.ctrlKey) return;
    e.preventDefault();
    const range = pending || ts.getVisibleLogicalRange();
    if (!range) return;
    const x = e.clientX - el.getBoundingClientRect().left;
    const anchor = ts.coordinateToLogical(x) ?? (range.from + range.to) / 2;
    const dy = e.deltaMode === 1 ? e.deltaY * 33 : e.deltaY;
    const factor = Math.exp(Math.max(-100, Math.min(100, dy)) * 0.002);
    const from = Math.max(0, anchor - (anchor - range.from) * factor);
    const to = Math.min(lastIndex + RIGHT_GAP, anchor + (range.to - anchor) * factor);
    if (to - from < 5) return;
    pending = { from, to };
    ts.setVisibleLogicalRange(pending);
  }, { passive: false });
}

const LINE_STYLE_DOTTED = (window.LightweightCharts && LightweightCharts.LineStyle) ? LightweightCharts.LineStyle.Dotted : 1;

function renderBlock(candles, chartElId, macdElId, visibleCount, opts = {}) {
  const chartEl = document.getElementById(chartElId);
  const macdEl = document.getElementById(macdElId);
  if (!candles || candles.length === 0) {
    chartEl.outerHTML = `<div class="chart-placeholder" id="${chartElId}">No chart data yet — waiting for the next scan</div>`;
    macdEl.style.display = 'none';
    return;
  }

  const chart = LightweightCharts.createChart(chartEl, { ...chartTheme, width: chartEl.clientWidth, height: chartEl.clientHeight });
  activeCharts.push({ chart, el: chartEl });
  const candleSeries = chart.addCandlestickSeries({ upColor: cssVar('--gain'), downColor: cssVar('--loss'), borderVisible: false, wickUpColor: cssVar('--gain'), wickDownColor: cssVar('--loss'), priceLineVisible: false, lastValueVisible: false });
  candleSeries.setData(candles);
  // Axis decimals sized to the price: ~3 significant digits (5 for forex,
  // to keep pips), at least 2 decimals — 3.60, 0.0977, 1.3235. Custom
  // formatter: the library's own mangles >8 decimals (sub-cent crypto).
  const refPrice = Math.abs(candles[candles.length - 1].close) || 1;
  const sig = opts.forex ? 4 : 2;
  const precision = Math.min(12, Math.max(2, Math.ceil(-Math.log10(refPrice)) + sig));
  candleSeries.applyOptions({ priceFormat: { type: 'custom', minMove: Math.pow(10, -precision), formatter: p => p.toFixed(precision) } });

  [
    { key: 'ema10', c: '#D9A441', style: 0, width: 1 },
    { key: 'ema20', c: cssVar('--violet'), style: 0, width: 1 },
    { key: 'lsma', c: cssVar('--blue'), style: LINE_STYLE_DOTTED, width: 2 },
  ].forEach(o => {
    const s = chart.addLineSeries({ color: o.c, lineWidth: o.width, lineStyle: o.style, priceLineVisible: false, lastValueVisible: false });
    s.setData(candles.map(c => ({ time: c.time, value: c[o.key] })).filter(p => p.value != null));
  });

  const from = Math.max(0, candles.length - visibleCount);
  const home = { from, to: candles.length - 1 + RIGHT_GAP };
  chart.timeScale().setVisibleLogicalRange(home);
  attachCtrlWheelZoom(chart, chartEl, candles.length - 1);
  const resetBtn = document.getElementById(`${chartElId}-reset`);
  if (resetBtn) resetBtn.addEventListener('click', () => {
    chart.priceScale('right').applyOptions({ autoScale: true });
    chart.timeScale().setVisibleLogicalRange(home);
  });

  const ink = cssVar('--ink');
  if (opts.triggers && opts.triggers.times && opts.triggers.times.length) {
    // Every qualifying candle in the window, in neutral ink so it never
    // blends into a green or red candle; only the latest gets a label.
    const isBuy = opts.triggers.direction === 'BULLISH';
    const times = opts.triggers.times.map(toUnixTime).filter(t => t != null).sort((a, b) => a - b);
    candleSeries.setMarkers(times.map((t, i) => ({
      time: t, position: isBuy ? 'belowBar' : 'aboveBar', color: ink,
      shape: isBuy ? 'arrowUp' : 'arrowDown', text: i === times.length - 1 ? 'RSI TRIGGER' : '',
    })));
  }
  if (opts.cycles && opts.cycles.events && opts.cycles.events.length) {
    // Basket pick on a lower tf: every step of every entry cycle. Pullback
    // and armed are small dots; entries are white (ink) arrows.
    const bull = opts.cycles.direction === 'BULLISH';
    const pbSide = bull ? 'belowBar' : 'aboveBar';
    const style = {
      pullback: { position: pbSide, color: cssVar('--gold-bright'), shape: 'circle', size: 0.5 },
      armed: { position: pbSide, color: cssVar('--violet'), shape: 'circle', size: 0.5 },
      entry: { position: bull ? 'belowBar' : 'aboveBar', color: ink, shape: bull ? 'arrowUp' : 'arrowDown' },
    };
    const inChart = new Set(candles.map(c => c.time));
    candleSeries.setMarkers(opts.cycles.events
      .map(e => ({ time: toUnixTime(e.time), ...style[e.type] }))
      .filter(m => m.position && inChart.has(m.time))
      .sort((a, b) => a.time - b.time));
  }

  const macdChart = LightweightCharts.createChart(macdEl, { ...chartTheme, ...followerInteraction, width: macdEl.clientWidth, height: macdEl.clientHeight, rightPriceScale: { borderVisible: false, textColor: 'transparent', minimumWidth: AXIS_WIDTH }, timeScale: { visible: false, rightOffset: RIGHT_GAP } });
  activeCharts.push({ chart: macdChart, el: macdEl });
  macdChart.addHistogramSeries({ priceLineVisible: false, lastValueVisible: false })
    .setData(candles.filter(c => c.macd_hist != null).map(c => ({ time: c.time, value: c.macd_hist, color: c.macd_hist >= 0 ? 'rgba(79,169,114,0.55)' : 'rgba(168,64,44,0.55)' })));
  macdChart.addLineSeries({ color: '#D9A441', lineWidth: 1, priceLineVisible: false, lastValueVisible: false })
    .setData(candles.map(c => ({ time: c.time, value: c.macd })).filter(p => p.value != null));
  macdChart.addLineSeries({ color: '#6FA8DC', lineWidth: 1, priceLineVisible: false, lastValueVisible: false })
    .setData(candles.map(c => ({ time: c.time, value: c.macd_signal })).filter(p => p.value != null));
  macdChart.timeScale().setVisibleLogicalRange(home);
  chart.timeScale().subscribeVisibleLogicalRangeChange(range => { if (range) macdChart.timeScale().setVisibleLogicalRange(range); });
}

// ---------------------------------------------------------------------------
// Basket — hand-picked (asset, higher tf) setups in the repo's basket.json.
// Read via the GitHub API; written with a fine-grained token kept only in
// this browser. The workflows read the same file.
// ---------------------------------------------------------------------------
const REPO = location.hostname.endsWith('.github.io')
  ? `${location.hostname.split('.')[0]}/${location.pathname.split('/')[1]}`
  : 'osdvillar22/ov-scanner';
const BASKET_API = `https://api.github.com/repos/${REPO}/contents/basket.json`;
const TOKEN_KEY = 'ovs-github-token';
const getToken = () => { try { return localStorage.getItem(TOKEN_KEY) || ''; } catch (e) { return ''; } };
const setToken = (t) => { try { t ? localStorage.setItem(TOKEN_KEY, t) : localStorage.removeItem(TOKEN_KEY); } catch (e) {} };

let basketPicks = [];      // as last read from GitHub
let basketStatus = {};     // per-pick lower-tf status from the last hourly scan
let repaintBasketButton = () => {};

function ghHeaders() {
  const h = { Accept: 'application/vnd.github+json' };
  const t = getToken();
  if (t) h.Authorization = `Bearer ${t}`;
  return h;
}
const b64decode = (s) => new TextDecoder().decode(Uint8Array.from(atob(s.replace(/\n/g, '')), c => c.charCodeAt(0)));
const b64encode = (s) => btoa(String.fromCharCode(...new TextEncoder().encode(s)));

async function fetchBasket() {
  const resp = await fetch(BASKET_API, { headers: ghHeaders(), cache: 'no-store' });
  if (resp.status === 404) return { picks: [], sha: null };
  if (!resp.ok) throw new Error(`GitHub ${resp.status}`);
  const file = await resp.json();
  return { picks: JSON.parse(b64decode(file.content)).picks || [], sha: file.sha };
}

// Read-modify-write against the file's current sha; a 409 means a workflow
// (e.g. an auto-removal) wrote in between — redo it on top.
async function updateBasket(mutate, message) {
  if (!getToken()) throw new Error('no token');
  for (let attempt = 0; attempt < 3; attempt++) {
    const { picks, sha } = await fetchBasket();
    const next = mutate(picks.slice());
    const body = { message, content: b64encode(JSON.stringify({ picks: next }, null, 2) + '\n') };
    if (sha) body.sha = sha;
    const resp = await fetch(BASKET_API, { method: 'PUT', headers: { ...ghHeaders(), 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
    if (resp.status === 409 || resp.status === 422) continue;
    if (resp.status === 401) throw new Error('token rejected or expired — check basket settings');
    if (resp.status === 403 || resp.status === 404) throw new Error("token can't write to this repo — it needs Contents: Read and write on ov-scanner");
    if (!resp.ok) throw new Error(`GitHub ${resp.status}`);
    basketPicks = next;
    return;
  }
  throw new Error('basket changed repeatedly, try again');
}

const inBasket = (key) => basketPicks.some(p => pickKey(p) === key);

function requireToken() {
  if (getToken()) return true;
  document.getElementById('basketSettings').classList.remove('is-hidden');
  document.getElementById('tokenMsg').textContent = 'Add your GitHub token here first to change the basket.';
  window.scrollTo({ top: 0, behavior: 'smooth' });
  return false;
}

// The one add/remove path for the header button, rows and basket list.
async function toggleBasket(pick) {
  const key = pickKey(pick), removing = inBasket(key);
  await updateBasket(picks => removing
    ? picks.filter(p => pickKey(p) !== key)
    : picks.filter(p => pickKey(p) !== key).concat([{
        asset_class: pick.asset_class, ticker: pick.ticker, display_name: pick.display_name,
        higher_tf: pick.higher_tf, direction: pick.direction, added_at: new Date().toISOString(),
      }]),
    `Basket: ${removing ? 'remove' : 'add'} ${pick.display_name} ${pick.higher_tf}`);
  refreshBasketViews();
  return removing ? 'removed' : 'added';
}

// Mute / unmute one lower tf of a pick: still evaluated and shown, never alerted.
async function toggleMute(pick, ltf) {
  const key = pickKey(pick);
  const muted = new Set(pick.muted || []);
  muted.has(ltf) ? muted.delete(ltf) : muted.add(ltf);
  await updateBasket(picks => picks.map(p => pickKey(p) === key ? { ...p, muted: [...muted] } : p),
    `Basket: ${muted.has(ltf) ? 'mute' : 'unmute'} ${pick.display_name} ${pick.higher_tf} ${ltf}`);
  refreshBasketViews();
}

function refreshBasketViews() {
  renderBasket();
  repaintBasketButton();
  document.querySelectorAll('#watchlist .row').forEach(paintRow);
}

// "4:38 PM" today, "Sep 23 4:38 PM" otherwise.
function fmtTime(iso) {
  const d = new Date(iso), today = new Date().toDateString() === d.toDateString();
  const time = d.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });
  return today ? time : `${d.toLocaleDateString([], { month: 'short', day: 'numeric' })} ${time}`;
}

const STATE_TEXT = {
  waiting: ['waiting', 'Waiting for a pullback past the LSMA'],
  pulled_back: ['pulled back', "Pulled back past the LSMA — MACD hasn't followed yet"],
  armed: ['armed', 'Pulled back + MACD followed — the next LSMA break alerts'],
  no_data: ['no data', "Couldn't fetch this timeframe on the last check"],
};

// A pick's watch (for its market tag / large-cap flag / charts), if still on.
const watchOf = (p) => assetsById[`${p.asset_class}__${p.ticker}__${p.higher_tf}`];

function basketPickVisible(p) {
  const w = watchOf(p);
  if (!marketMatch(w || p)) return false;
  if (F.tf === 'ALIGNED') { const byTf = watchesBySym[symKey(p)]; if (!byTf || !isAligned(byTf)) return false; }
  else if (F.tf !== 'ALL' && p.higher_tf !== F.tf) return false;
  return F.dir === 'ALL' || p.direction === F.dir;
}

function renderBasket() {
  const el = document.getElementById('basketList');
  document.getElementById('bkCount').textContent = basketPicks.length;
  if (!basketPicks.length) {
    el.innerHTML = `<div class="empty">No picks yet. Tap <strong>+</strong> on a watchlist row to add its timeframe — its lower timeframes are then watched for your entry, with a Discord alert when it fires.</div>`;
    return;
  }
  const shown = basketPicks.filter(basketPickVisible);
  if (!shown.length) { el.innerHTML = `<div class="empty">No basket picks match these filters.</div>`; return; }
  el.innerHTML = shown.map(p => {
    const key = pickKey(p), w = watchOf(p), st = basketStatus[key], muted = new Set(p.muted || []);
    const name = w ? w.display_name : p.display_name, tag = w && w.tag && p.asset_class !== 'pse' ? w.tag : '';
    let body;
    if (!w) {
      body = '<div class="bk-gone">off the watchlist — being removed</div>';
    } else {
      // One entry per lower tf: its latest activity only (full history is on
      // the lower-tf charts). Tap to mute / unmute its alerts.
      body = `<div class="bk-ltfs">${LOWER_TF_MAP[p.higher_tf].map(ltf => {
        const s = st && st[ltf];
        let text = 'pending', cls = 'pending', tip = 'Status appears after the next hourly scan';
        if (s) {
          const last = (s.events || []).at(-1);
          if (s.state === 'waiting' && last && last.type === 'entry') { text = `entry ${fmtTime(last.time)}`; cls = 'entry'; tip = 'Latest entry — waiting for the next pullback'; }
          else { [text, tip] = STATE_TEXT[s.state] || [s.state, '']; cls = s.state; }
        }
        const m = muted.has(ltf);
        return `<button class="sw${m ? ' muted' : ''}" type="button" data-ltf="${ltf}" title="${esc(tip)} · ${m ? 'alerts muted — tap to unmute' : 'tap to mute alerts'}"><span class="k">${ltf}</span><span class="st-${cls}">${text}</span></button>`;
      }).join('')}</div>`;
    }
    return `
      <div class="bk" data-key="${esc(key)}" data-id="${w ? w._id : ''}" title="${p.asset_class === 'crypto' ? 'Checked every 5 minutes' : p.asset_class === 'pse' ? 'Checked every 5 minutes during PSE hours' : 'Checked hourly'}">
        <div class="bk-head">
          <span><span class="sym">${esc(name)}</span>${tag ? `<span class="tag">${tag}</span>` : ''}<span class="bk-htf ${dirClass(p.direction)}">${p.higher_tf}${dirArrow(p.direction)}</span></span>
          <button class="bk-x" type="button" aria-label="Remove ${esc(name)} ${p.higher_tf} from the basket" title="Remove from the basket">×</button>
        </div>
        ${body}
        <div class="bk-msg"></div>
      </div>`;
  }).join('') + `<div class="hint">tap a timeframe to mute or unmute its alerts</div>`;

  el.querySelectorAll('.bk').forEach(card => {
    const pick = basketPicks.find(p => pickKey(p) === card.dataset.key);
    if (card.dataset.id) card.addEventListener('click', () => selectAsset(card.dataset.id));
    const say = (t) => { card.querySelector('.bk-msg').textContent = t; };
    card.querySelector('.bk-x').addEventListener('click', async (e) => {
      e.stopPropagation();
      if (!requireToken()) return;
      e.currentTarget.disabled = true; say('removing…');
      try { await toggleBasket(pick); } catch (err) { say(`Couldn't remove: ${err.message}`); }
    });
    card.querySelectorAll('.sw').forEach(sw => sw.addEventListener('click', async (e) => {
      e.stopPropagation();
      if (!requireToken()) return;
      sw.disabled = true;
      try { await toggleMute(pick, sw.dataset.ltf); } catch (err) { say(`Couldn't save: ${err.message}`); sw.disabled = false; }
    }));
  });
  const open = document.querySelector('#detail [data-current-id]');
  const openId = open && open.dataset.currentId;
  el.querySelectorAll('.bk').forEach(c => c.classList.toggle('active', !!openId && c.dataset.id === openId));
}

function wireBasketSettings() {
  const panel = document.getElementById('basketSettings'), input = document.getElementById('tokenInput'), msg = document.getElementById('tokenMsg');
  const showState = () => { msg.textContent = getToken() ? 'A token is saved in this browser.' : 'No token saved — the basket is read-only here.'; };
  document.getElementById('basketSettingsBtn').addEventListener('click', () => { panel.classList.toggle('is-hidden'); showState(); });
  document.getElementById('tokenClear').addEventListener('click', () => { setToken(''); input.value = ''; showState(); });
  document.getElementById('tokenSave').addEventListener('click', async () => {
    const t = input.value.trim();
    if (!t) { msg.textContent = 'Paste a token first.'; return; }
    msg.textContent = 'Checking…';
    // Confirms the token is valid; write access shows on the first save.
    const resp = await fetch('https://api.github.com/user', { headers: { Accept: 'application/vnd.github+json', Authorization: `Bearer ${t}` }, cache: 'no-store' });
    if (!resp.ok) { msg.textContent = `GitHub rejected that token (${resp.status}).`; return; }
    setToken(t); input.value = ''; msg.textContent = 'Saved. Add a pick to confirm it can write to the repo.';
  });
}

// ---------------------------------------------------------------------------
// Watchlist
// ---------------------------------------------------------------------------
// Which of an asset's watches a row opens/summarises: among those matching
// the tf/direction filters, the one that triggered most recently.
function primaryWatch(byTf) {
  if (F.tf === 'ALIGNED' && !isAligned(byTf)) return null;
  const any = Object.values(byTf)[0];
  const candidates = tfsFor(any).map(tf => byTf[tf]).filter(w => w
    && (F.tf === 'ALL' || F.tf === 'ALIGNED' || w.higher_tf === F.tf)
    && (F.dir === 'ALL' || w.direction === F.dir));
  candidates.sort((x, y) => x.candles_ago_most_recent - y.candles_ago_most_recent);
  return candidates[0] || null;
}

// Row = one asset. data-tf is the watch it shows: its RSI, its + / ✓, and
// the boldest of the timeframe labels. Triggered tfs are coloured, others
// grey; a gold underline marks a tf that's in the basket.
function paintRow(row) {
  const byTf = watchesBySym[row.dataset.sym], w = byTf && byTf[row.dataset.tf];
  if (!w) return;
  row.dataset.id = w._id;
  const rsi = row.querySelector('.rsi');
  rsi.textContent = w.last_rsi ?? w.rsi_at_trigger;
  rsi.className = `rsi ${dirClass(w.direction)}`;
  row.querySelectorAll('.tfs [data-tf]').forEach(m => {
    m.classList.toggle('shown', m.dataset.tf === w.higher_tf);
    m.classList.toggle('in-basket', !!byTf[m.dataset.tf] && inBasket(pickKey(byTf[m.dataset.tf])));
  });
  const plus = row.querySelector('.plus'), inB = inBasket(pickKey(w));
  plus.classList.toggle('in', inB);
  plus.textContent = inB ? '✓' : '+';
  plus.title = inB ? `In the basket (${w.higher_tf}) — tap to remove` : `Add ${w.display_name} ${w.higher_tf} to the basket`;
  plus.setAttribute('aria-label', plus.title);
}

function applyFilters() {
  let visible = 0;
  document.querySelectorAll('#watchlist .grp-block').forEach(block => {
    let any = false;
    block.querySelectorAll('.row').forEach(row => {
      const byTf = watchesBySym[row.dataset.sym];
      const w = marketMatch(Object.values(byTf)[0]) ? primaryWatch(byTf) : null;
      row.style.display = w ? '' : 'none';
      if (!w) return;
      any = true; visible++;
      row.dataset.tf = w.higher_tf;
      paintRow(row);
    });
    block.style.display = any ? '' : 'none';
  });
  document.getElementById('wlCount').textContent = visible;
  renderBasket();
}

function buildFilters(syms) {
  const all = syms.map(byTf => Object.values(byTf)[0]);
  const count = (pred) => syms.filter(byTf => Object.values(byTf).some(pred)).length;
  const opt = (group, value, label, n) => `<button class="opt${F[group] === value ? ' on' : ''}" type="button" data-group="${group}" data-value="${value}">${label}${n != null ? `<span class="n">${n}</span>` : ''}</button>`;

  const market = document.querySelector('.seg[data-group="market"]');
  market.insertAdjacentHTML('beforeend', MARKETS.map(([v, l]) =>
    opt('market', v, l, v === 'all' ? all.length : all.filter(a => marketsOf(a).has(v)).length)).join('')
    + `<button class="sub-opt is-hidden" type="button" id="largeCaps">large caps<span class="n">${all.filter(a => a.large_cap).length}</span></button>`);

  const tf = document.querySelector('.seg[data-group="tf"]');
  tf.insertAdjacentHTML('beforeend', [['ALL', 'all', syms.length], ['1H', '1H'], ['4H', '4H'], ['1D', '1D'], ['1W', '1W'], ['ALIGNED', 'aligned', syms.filter(isAligned).length]]
    .map(([v, l, n]) => opt('tf', v, l, n != null ? n : count(w => w.higher_tf === v))).join(''));

  const dir = document.querySelector('.seg[data-group="dir"]');
  dir.insertAdjacentHTML('beforeend', [['ALL', 'all'], ['BULLISH', '<span class="bullish">▲</span>'], ['BEARISH', '<span class="bearish">▼</span>']]
    .map(([v, l]) => opt('dir', v, l, v === 'ALL' ? null : count(w => w.direction === v))).join(''));

  document.querySelectorAll('#filters .opt').forEach(b => b.addEventListener('click', () => {
    F[b.dataset.group] = b.dataset.value;
    if (b.dataset.group === 'market') F.large = false;
    document.querySelectorAll(`#filters .opt[data-group="${b.dataset.group}"]`).forEach(x => x.classList.toggle('on', x === b));
    const lc = document.getElementById('largeCaps');
    lc.classList.toggle('is-hidden', F.market !== 'crypto');
    lc.classList.toggle('on', F.large);
    applyFilters();
  }));
  document.getElementById('largeCaps').addEventListener('click', (e) => {
    F.large = !F.large;
    e.currentTarget.classList.toggle('on', F.large);
    applyFilters();
  });
}

function buildWatchlist(syms) {
  const grouped = {};
  syms.forEach(byTf => { const cls = Object.values(byTf)[0].asset_class; (grouped[cls] = grouped[cls] || []).push(byTf); });
  const el = document.getElementById('watchlist');
  el.innerHTML = GROUP_ORDER.filter(cls => grouped[cls]).map(cls => `
    <div class="grp-block">
      <div class="grp"><span>${GROUP_LABELS[cls] || cls.toUpperCase()}</span>${cls === 'pse' ? `<span class="session${pseOpen() ? ' open' : ''}">${pseOpen() ? 'open' : 'closed'}</span>` : ''}</div>
      ${grouped[cls].map(byTf => {
        const a = Object.values(byTf)[0];
        const tfs = tfsFor(a).map(tf => {
          const w = byTf[tf];
          return w ? `<button type="button" class="${dirClass(w.direction)}" data-tf="${tf}" title="Open ${tf}">${tf}${dirArrow(w.direction)}</button>` : `<span class="off">${tf}</span>`;
        }).join('');
        const tag = a.tag && a.asset_class !== 'pse' ? `<span class="tag">${a.tag}</span>` : '';
        return `
        <div class="row" data-sym="${esc(symKey(a))}">
          <div class="row-name"><span class="sym">${esc(a.display_name)}</span>${tag}<span class="rsi"></span></div>
          <div class="tfs">${tfs}</div>
          <button type="button" class="plus"></button>
        </div>`;
      }).join('')}
    </div>`).join('');

  el.querySelectorAll('.row').forEach(row => {
    row.addEventListener('click', () => selectAsset(row.dataset.id));
    row.querySelectorAll('.tfs button').forEach(m => m.addEventListener('click', (e) => {
      e.stopPropagation();
      selectAsset(watchesBySym[row.dataset.sym][m.dataset.tf]._id);
    }));
    row.querySelector('.plus').addEventListener('click', async (e) => {
      e.stopPropagation();
      if (!requireToken()) return;
      const btn = e.currentTarget, w = watchesBySym[row.dataset.sym][row.dataset.tf];
      btn.disabled = true; btn.textContent = '…';
      try { await toggleBasket(w); }
      catch (err) { alert(`Couldn't save the basket: ${err.message}`); }
      finally { btn.disabled = false; paintRow(row); }
    });
  });
}

// ---------------------------------------------------------------------------
// Asset view
// ---------------------------------------------------------------------------
function selectAsset(id) {
  const entry = assetsById[id];
  if (!entry) return;
  document.querySelectorAll('#watchlist .row').forEach(row => {
    const isOpen = row.dataset.sym === symKey(entry);
    row.classList.toggle('active', isOpen);
    if (isOpen && row.dataset.tf !== entry.higher_tf) { row.dataset.tf = entry.higher_tf; paintRow(row); }
  });
  document.querySelectorAll('#basketList .bk').forEach(c => c.classList.toggle('active', c.dataset.id === id));
  teardownCharts();

  const direction = entry.direction, dc = dirClass(direction);
  const siblings = watchesBySym[symKey(entry)] || {};
  const cycleStatus = basketStatus[pickKey(entry)] || null;
  const lowerTfs = Object.keys(entry.lower_tf_candles || {});
  const tfSwitch = tfsFor(entry).map(tf => {
    const w = siblings[tf];
    if (!w) return `<span class="tf-sw off" title="Not on watch on ${tf}">${tf}</span>`;
    return `<button class="tf-sw ${dirClass(w.direction)}${tf === entry.higher_tf ? ' current' : ''}" type="button" data-id="${w._id}">${tf}${dirArrow(w.direction)}</button>`;
  }).join('');
  const sub = entry.asset_class === 'pse' ? 'PSE' : (entry.tag || (entry.ticker !== entry.display_name ? entry.ticker : ''));
  const ago = entry.candles_ago_most_recent;
  const noLsma = entry.higher_tf === '1W' && entry.asset_class === 'pse';

  const detail = document.getElementById('detail');
  detail.innerHTML = `
    <div class="d-top" data-current-id="${id}">
      <div><span class="d-name">${esc(entry.display_name)}</span>${sub ? `<span class="d-sub">${esc(sub)}</span>` : ''} <span class="rsi ${dc}">RSI ${entry.last_rsi ?? '—'}</span></div>
      <div class="d-right">${tfSwitch}</div>
    </div>
    <div class="d-summary">${entry.higher_tf} <span class="${dc}">${dc} continuation</span> · trend${noLsma ? '' : ' + LSMA'} + RSI ${direction === 'BULLISH' ? '&gt; 70' : '&lt; 30'} · ${entry.qualifying_count} of ${entry.window} qualified · last ${ago} ${ago === 1 ? 'candle' : 'candles'} ago</div>
    <div class="d-actions"><button class="bk-btn" id="basketBtn" type="button"></button><span class="msg" id="basketMsg"></span></div>

    <div class="legend">
      <span><span class="ln" style="border-color:#D9A441"></span>EMA10</span>
      <span><span class="ln" style="border-color:var(--violet)"></span>EMA20</span>
      <span><span class="ln" style="border-color:var(--blue);border-top-style:dotted"></span>LSMA 50,3</span>
      <span class="push">ctrl+scroll or pinch to zoom · drag to pan</span>
    </div>
    <div class="chart-head"><span class="chart-label">${entry.higher_tf} <span class="dim">trigger timeframe</span></span><button class="reset" id="detail-chart-reset" type="button">reset zoom</button></div>
    <div class="chart-box" id="detail-chart"></div>
    <div class="macd-box" id="detail-macd"></div>
    <div class="price-line"><span id="detail-price">—</span><span id="detail-pct">—</span></div>

    <div class="section"><span>LOWER TIMEFRAMES</span>${cycleStatus ? `<span class="cy"><span style="color:var(--gold-bright)">●</span> pulled back &nbsp;<span style="color:var(--violet)">●</span> armed &nbsp;<span>${dirArrow(direction)}</span> entry</span>` : ''}</div>
    ${lowerTfs.map((ltf, li) => `
      <div class="chart-head"><span class="chart-label">${ltf}</span><button class="reset" id="detail-mini-${li}-reset" type="button">reset zoom</button></div>
      <div class="chart-box" id="detail-mini-${li}"></div>
      <div class="macd-box" id="detail-minimacd-${li}"></div>
    `).join('')}`;

  detail.querySelectorAll('.tf-sw[data-id]').forEach(b => { if (b.dataset.id !== id) b.addEventListener('click', () => selectAsset(b.dataset.id)); });
  wireBasketButton(entry);

  const forex = marketsOf(entry).has('forex');
  const candles = toCandles(entry.candles);
  renderBlock(candles, 'detail-chart', 'detail-macd', entry.window || 25,
    { forex, triggers: entry.trigger_times ? { times: entry.trigger_times, direction } : null });
  if (candles.length > 1) {
    const last = candles[candles.length - 1].close, first = candles[0].close;
    const pct = (last - first) / first * 100;
    document.getElementById('detail-price').textContent = last;
    const pctEl = document.getElementById('detail-pct');
    pctEl.textContent = `${pct >= 0 ? '+' : ''}${pct.toFixed(2)}%`;
    pctEl.className = pct >= 0 ? 'up' : 'down';
  }
  lowerTfs.forEach((ltf, li) => {
    const c = toCandles(entry.lower_tf_candles[ltf]);
    renderBlock(c, `detail-mini-${li}`, `detail-minimacd-${li}`, c.length,
      { forex, cycles: cycleStatus && cycleStatus[ltf] ? { events: cycleStatus[ltf].events, direction } : null });
  });
}

function wireBasketButton(entry) {
  const btn = document.getElementById('basketBtn'), msg = document.getElementById('basketMsg');
  const key = pickKey(entry);
  const paint = () => {
    btn.classList.toggle('in', inBasket(key));
    btn.textContent = inBasket(key) ? `✓ in basket (${entry.higher_tf}) · remove` : `+ add ${entry.higher_tf} to basket`;
  };
  paint();
  repaintBasketButton = paint;
  btn.addEventListener('click', async () => {
    if (!requireToken()) return;
    btn.disabled = true; msg.textContent = 'saving…';
    try { msg.textContent = (await toggleBasket(entry)) === 'removed' ? 'removed' : 'added — watched from the next check'; }
    catch (err) { msg.textContent = `Couldn't save: ${err.message}`; }
    finally { btn.disabled = false; paint(); }
  });
}

// ---------------------------------------------------------------------------
// Init
// ---------------------------------------------------------------------------
async function init() {
  wireBasketSettings();
  document.querySelectorAll('.panel-tab').forEach(tab => tab.addEventListener('click', () => {
    document.querySelectorAll('.panel-tab').forEach(t => t.classList.toggle('active', t === tab));
    document.getElementById('watchlist').classList.toggle('is-hidden', tab.dataset.view !== 'watchlist');
    document.getElementById('basketList').classList.toggle('is-hidden', tab.dataset.view !== 'basket');
  }));

  let data;
  try {
    const resp = await fetch('data.json', { cache: 'no-store' });
    if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
    data = await resp.json();
  } catch (err) {
    document.querySelector('.layout').innerHTML = `
      <div class="load-error">
        <strong>Couldn't load data.json</strong> (${esc(err.message)}).<br><br>
        If you opened this file directly (<code>file://</code>), browsers block that fetch. Serve the folder over local HTTP instead:<br><br>
        <code>python -m http.server 8000</code> then open <code>http://localhost:8000/dashboard.html</code>.
      </div>`;
    return;
  }

  const assets = data.assets || [];
  basketStatus = data.basket_status || {};
  watchesBySym = {}; assetsById = {};
  assets.forEach(a => {
    a._id = `${symKey(a)}__${a.higher_tf}`;
    assetsById[a._id] = a;
    (watchesBySym[symKey(a)] = watchesBySym[symKey(a)] || {})[a.higher_tf] = a;
  });
  const syms = Object.values(watchesBySym);

  const scanTime = data.generated_at ? new Date(data.generated_at).toLocaleString([], { month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' }) : '—';
  document.getElementById('scanMeta').innerHTML = `scan <strong>${scanTime}</strong> · <strong>${syms.length}</strong> on watch`;

  buildFilters(syms);
  if (!assets.length) {
    document.getElementById('detail').innerHTML = '<div class="empty">Nothing on watch right now — no asset meets the trigger condition this scan.</div>';
    return;
  }
  buildWatchlist(syms);
  applyFilters();

  fetchBasket()
    .then(({ picks }) => { basketPicks = picks; refreshBasketViews(); })
    .catch(err => { document.getElementById('basketList').innerHTML = `<div class="empty">Couldn't load the basket (${esc(err.message)}).</div>`; });

  window.addEventListener('resize', () => activeCharts.forEach(({ chart, el }) => chart.applyOptions({ width: el.clientWidth })));

  const first = document.querySelector('#watchlist .row:not([style*="none"])');
  if (first) selectAsset(first.dataset.id);
}

init();
</script>
