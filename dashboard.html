<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OV SCANNER</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%2314140F'/%3E%3Ccircle cx='10' cy='16' r='5.5' fill='none' stroke='%23E8CC66' stroke-width='3'/%3E%3Cpath d='M18.5 10.5l3.5 11 3.5-11' fill='none' stroke='%23E8CC66' stroke-width='3' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/lightweight-charts@4.1.3/dist/lightweight-charts.standalone.production.js"></script>
<link rel="stylesheet" href="ov.css">
<style>
  /* Filters: markets as tabs (the main choice), refinements as one quiet
     line of chips underneath. */
  .filters { margin-top: 10px; }
  .mkt-tabs { display: flex; gap: 18px; border-bottom: 1px solid var(--hair); overflow-x: auto; scrollbar-width: none; }
  .mkt-tabs::-webkit-scrollbar { display: none; }
  .mkt { font-size: 12px; padding: 2px 0 6px; color: var(--ink-dim); white-space: nowrap; }
  .mkt:hover { color: var(--ink); }
  .mkt.on { color: var(--ink); box-shadow: inset 0 -2px 0 var(--gold-bright); }
  .mkt.zero:not(.on) { color: var(--ink-faint); }
  .mkt .n { color: var(--ink-faint); margin-left: 4px; font-size: 10.5px; }
  .mkt.on .n { color: var(--ink-dim); }
  .refine { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 12px; margin-top: 8px; }
  .seg { display: flex; align-items: center; gap: 2px; flex-wrap: wrap; }
  .fsep { width: 1px; height: 12px; background: var(--border); }
  #lcWrap { display: contents; }
  .opt { font-size: 11px; padding: 2px 7px; border-radius: 4px; color: var(--ink-dim); border: 1px solid transparent; }
  .opt:hover { color: var(--ink); }
  .opt.on { color: var(--ink); background: var(--surface-raised); border-color: var(--border); }
  .opt .n { color: var(--ink-faint); margin-left: 3px; }
  .opt.on .n { color: var(--ink-dim); }
  .sub-opt { font-size: 11px; padding: 2px 7px; border-radius: 4px; border: 1px dashed var(--border); color: var(--ink-dim); }
  .sub-opt.on { border-style: solid; border-color: var(--gold-bright); color: var(--gold-bright); }

  /* ---- Watchlist rows: one line — name + RSI · timeframes · +/✓ ---- */
  /* Batches: one per scan, newest first; 2+ days old fold into "older". */
  .grp { font-size: 10px; color: var(--ink-dim); padding: 6px 10px 3px; background: var(--surface-raised); display: flex; justify-content: space-between; gap: 8px; }
  .grp .when { letter-spacing: 0.06em; }
  .grp-block.latest .when { color: var(--gold-bright); }
  .grp-fold { cursor: pointer; }
  .grp-fold:hover { color: var(--ink); }
  .grp-block.folded .row { display: none !important; }
  #watchlist.searching .grp-block.folded .row { display: grid !important; }
  #watchlist.searching .grp-block.folded .row[style*="none"] { display: none !important; }
  .wl-sum { display: flex; justify-content: space-between; gap: 8px; padding: 5px 10px; font-size: 10.5px; color: var(--ink-faint); border-bottom: 1px solid var(--hair); }
  .wl-sum .new { color: var(--gain); }
  .wl-sum .rmb { color: var(--loss); text-decoration: underline dotted; text-underline-offset: 3px; }
  .wl-sum .session.open { color: var(--gain); }
  .row { display: grid; grid-template-columns: minmax(0, 1fr) auto 18px; align-items: center; gap: 8px; padding: 8px 10px 6px; border-bottom: 1px solid var(--hair); cursor: pointer; }
  .row:hover { background: var(--surface-raised); }
  .row.active { background: var(--surface-raised); box-shadow: inset 2px 0 0 var(--gold-bright); }
  .row-name { min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .sym { font-weight: 600; font-size: 12px; }
  .tag { font-size: 10px; color: var(--ink-dim); margin-left: 4px; }
  .rsi { font-size: 11px; margin-left: 6px; }
  .tfs { display: flex; gap: 7px; font-size: 11px; }
  .tfs .off { color: var(--ink-faint); }
  /* MACD/LSMA state line above each tf (see MACD_STATE). */
  .tfs > * { position: relative; }
  .tfs > [style*="--m"]::before { content: ''; position: absolute; top: -4px; left: 0; right: 0; height: 2px; border-radius: 1px; background: var(--m); }
  .tfs > .s50[style*="--m"]::before { top: -5px; left: 2px; right: 2px; }
  .tfs button { padding: 1px 0; opacity: 0.85; }
  .tfs button:hover { opacity: 1; }
  .tfs .shown { font-weight: 700; opacity: 1; }
  /* SMA 50 watch on that tf: dashed box, like the chart's SMA 50 line. */
  .tfs .s50 { outline: 1px dashed var(--ink); outline-offset: 1px; border-radius: 2px; padding: 1px 2px; }
  /* In the basket: gold underline under that timeframe. */
  .tfs .in-basket { text-decoration: underline; text-decoration-color: var(--gold-bright); text-decoration-thickness: 2px; text-underline-offset: 3px; }
  /* Gold dot: the watch that put the row in this batch. */
  .tfs .nw::after { content: ''; position: absolute; top: -1px; right: -5px; width: 4px; height: 4px; border-radius: 50%; background: var(--gold-bright); }
  /* Removed in the last 24 h: crossed out, reason underneath. */
  .tfs .rm { color: var(--ink-faint); text-decoration: line-through; }
  .row-why { grid-column: 1 / -1; font-size: 10.5px; color: var(--ink-dim); margin-top: 1px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .row-why .x { color: var(--loss); }
  .row.gone { cursor: default; }
  .row.gone .sym { color: var(--ink-dim); }
  .row-why .on { color: var(--ink-faint); }
  #removedList .row-why { white-space: normal; }
  #removedList .tfs .rm { color: var(--ink-dim); }
  .plus { font-size: 14px; line-height: 1; color: var(--ink-faint); text-align: center; }
  .plus:hover { color: var(--gold-bright); }
  .plus.in { color: var(--gold-bright); }
  .plus:disabled { opacity: 0.4; cursor: wait; }

  /* ---- Basket cards: name, setup, then one row per lower tf with a switch ---- */
  .bk { padding: 7px 10px; border-bottom: 1px solid var(--hair); cursor: pointer; }
  .bk:hover { background: var(--surface-raised); }
  .bk.active { background: var(--surface-raised); box-shadow: inset 2px 0 0 var(--gold-bright); }
  .bk-head { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  .bk-htf { font-size: 11px; margin-left: 6px; }
  .bk-x { color: var(--ink-faint); font-size: 14px; line-height: 1; padding: 0 2px; }
  .bk-x:hover { color: var(--loss); }
  .bk-sub { font-size: 10.5px; color: var(--ink-dim); margin-top: 2px; }
  .s50-tag { outline: 1px dashed var(--ink); outline-offset: 1px; border-radius: 2px; padding: 0 3px; color: var(--ink); }
  /* Trade planning on the charts (see the Trade plan section). */
  .plan-btn { color: var(--gold-bright); }
  .plan-bar { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 12px; margin-top: 6px; padding: 6px 8px; font-size: 11px; color: var(--ink-dim); background: var(--surface-raised); border: 1px solid var(--border); border-radius: 4px; }
  .plan-bar b { color: var(--ink); font-weight: 500; }
  .plan-bar select { font: inherit; font-size: 11px; color: var(--ink); background: var(--bg); border: 1px solid var(--border); border-radius: 4px; padding: 1px 4px; }
  .plan-bar .go { color: var(--gain); border-color: var(--gain); }
  .plan-bar .push { margin-left: auto; display: flex; gap: 6px; }
  .trade-note { font-size: 11px; color: var(--ink-dim); }
  .trade-note a { color: var(--gold-bright); }
  .bk-lines { display: flex; align-items: center; gap: 5px; margin-top: 5px; font-size: 10.5px; color: var(--ink-dim); }
  .ln-chip { font-size: 10.5px; padding: 0 5px; border-radius: 3px; border: 1px solid var(--border); color: var(--ink-faint); }
  .ln-chip[aria-pressed="true"] { border-color: color-mix(in srgb, var(--gold-bright) 60%, var(--border)); color: var(--gold-bright); }
  .ln-chip:disabled { opacity: 0.5; cursor: wait; }
  .grp-dir .bullish, .grp-dir .bearish { margin-left: 4px; }
  .bk-ltfs { display: grid; grid-template-columns: 30px minmax(0, 1fr) auto; gap: 5px 6px; align-items: center; margin-top: 6px; font-size: 11px; }
  .bk-ltfs .k { color: var(--ink); }
  .bk-ltfs .off { color: var(--ink-faint); }
  .tgl { width: 24px; height: 13px; border-radius: 7px; background: var(--border); position: relative; flex-shrink: 0; }
  .tgl::after { content: ''; position: absolute; top: 2.5px; left: 3px; width: 8px; height: 8px; border-radius: 50%; background: var(--ink-faint); transition: left .15s; }
  .tgl[aria-checked="true"] { background: color-mix(in srgb, var(--gold-bright) 28%, var(--border)); }
  .tgl[aria-checked="true"]::after { left: 13px; background: var(--gold-bright); }
  .tgl:disabled { opacity: 0.5; cursor: wait; }
  .st-waiting, .st-pulled_back, .st-no_data, .st-pending { color: var(--ink-dim); }
  .st-armed { color: var(--gold-bright); }
  .st-entry, .st-done { color: var(--gain); }
  .bk-note { font-size: 10.5px; color: var(--ink-dim); margin-top: 3px; }
  .bk-gone { font-size: 10.5px; color: var(--loss); margin-top: 3px; }
  .bk-msg { font-size: 10.5px; color: var(--loss); }
  .bk-msg:empty { display: none; }
  .hint { padding: 7px 10px; font-size: 10.5px; color: var(--ink-faint); }

</style>
</head>
<body>

  <header class="page">
    <div class="topbar">
      <span class="brand">OV <span>SCANNER</span></span>
      <span class="meta"><span id="scanMeta">Loading…</span> · <a class="link-btn" href="forward.html">forward test</a> · <button class="link-btn" id="basketSettingsBtn" type="button">basket settings</button></span>
    </div>
    <div class="settings-panel is-hidden" id="basketSettings">
      <div><strong>Basket access.</strong> Adding and removing basket picks saves <code>basket.json</code> in your GitHub repo, which needs a token with access to this repo only. It's stored in this browser only — each device needs it once.</div>
      <div class="settings-row">
        <input type="password" id="tokenInput" placeholder="github_pat_…" autocomplete="off" spellcheck="false">
        <button class="text-btn" id="tokenSave" type="button">Save token</button>
        <button class="text-btn" id="tokenClear" type="button">Remove token</button>
      </div>
      <div class="settings-msg" id="tokenMsg"></div>
    </div>
    <div class="filters" id="filters">
      <div class="mkt-tabs" id="marketTabs" aria-label="Market"></div>
      <div class="refine">
        <span id="lcWrap" class="is-hidden"><button class="sub-opt" type="button" id="largeCaps" aria-pressed="false">large caps<span class="n"></span></button><span class="fsep"></span></span>
        <div class="seg" id="tfSeg" aria-label="Timeframe"></div>
        <span class="fsep"></span>
        <div class="seg" id="dirSeg" aria-label="Direction"></div>
        <span class="fsep"></span>
        <div class="seg" id="setupSeg" aria-label="Setup"></div>
      </div>
    </div>
  </header>

  <div class="layout">
    <div class="side-panel">
      <div class="panel-tabs">
        <button class="panel-tab active" data-view="watchlist" type="button">watchlist<span class="n" id="wlCount"></span></button>
        <button class="panel-tab" data-view="basket" type="button">basket<span class="n" id="bkCount"></span></button>
        <button class="panel-tab" data-view="removed" type="button" title="Watches removed in the last 24 hours">removed<span class="n" id="rmCount"></span></button>
      </div>
      <label class="search"><span aria-hidden="true">⌕</span><input type="search" id="search" placeholder="search…" autocomplete="off" spellcheck="false" aria-label="Search assets"><button class="search-clear is-hidden" id="searchClear" type="button" aria-label="Clear search">×</button></label>
      <div class="scroll" id="watchlist"></div>
      <div class="scroll is-hidden" id="basketList"></div>
      <div class="scroll is-hidden" id="removedList"></div>
    </div>
    <div class="detail-panel" id="detail"></div>
  </div>

<script src="ov.js"></script>
<script>
// ---------------------------------------------------------------------------
// Markets, timeframes, filters
// ---------------------------------------------------------------------------
const MARKETS = [
  ['all', 'all'], ['pse', 'PSE'], ['crypto', 'crypto'], ['forex', 'forex'],
  ['metals', 'metals'], ['indices', 'indices'], ['energy', 'energy'],
];
const GROUP_ORDER = ['pse', 'forex', 'metals', 'indices', 'energy', 'crypto'];
// Kraken's non-crypto pairs also count under their real market (TAG_MARKET, ov.js).

const TF_ORDER = ['1H', '4H', '1D'];          // markets without a weekly watch
const tfsFor = (a) => a.asset_class === 'pse' || a.asset_class === 'crypto' ? ['1H', '4H', '1D', '1W'] : TF_ORDER;
// Markets with a large-caps sub-filter (PSE = the PSEi 30).
const LARGE_CAP_MARKETS = ['pse', 'crypto'];

const F = { market: 'all', large: false, tf: 'ALL', dir: 'ALL', setup: 'ALL', q: '' };

// PSE session (Mon-Fri 9:30-15:00 Manila). Doesn't know PSE holidays.
function pseOpen() {
  const m = new Date(new Date().toLocaleString('en-US', { timeZone: 'Asia/Manila' }));
  const hm = m.getHours() * 60 + m.getMinutes();
  return m.getDay() >= 1 && m.getDay() <= 5 && hm >= 570 && hm < 900;
}

const symKey = (a) => `${a.asset_class}__${a.ticker}`;
// A tf can hold two watches: the trend watch ('4H') and the SMA 50 watch
// ('4H:50'). Picks and watches share keys with scan.py / basket.py.
const slotOf = (w) => isS50(w) ? `${w.higher_tf}:50` : w.higher_tf;
const setupMatch = (w, f = F) => f.setup === 'ALL' || (isS50(w) ? 'sma50' : 'trend') === f.setup;
// MACD/LSMA state at scan time, per tf: side of the LSMA sets green/red,
// a MACD against it fades the colour.
const MACD_STATE = {
  G: ['var(--gain)', 'MACD green · price above LSMA'],
  g: ['color-mix(in srgb, var(--gain) 45%, var(--bg))', 'MACD red · price above LSMA'],
  R: ['var(--loss)', 'MACD red · price below LSMA'],
  r: ['color-mix(in srgb, var(--loss) 45%, var(--bg))', 'MACD green · price below LSMA'],
};
const macdAttrs = (a, tf) => { const s = MACD_STATE[(a.macd_state || {})[tf]]; return s ? ` style="--m:${s[0]}" data-macd="${s[1]}"` : ''; };

let watchesBySym = {};     // symKey -> { '1H': watch, '4H:50': SMA 50 watch, ... }
let assetsById = {};       // watch _id -> watch
let removedBySym = {};     // symKey -> [removed watch, ...] (last 24 h, no charts)
let runStarted = null;     // this scan's start — every watch it found carries it
let olderFolded = true;
// Aligned = on watch, same direction, on every tf the market has (1W too for PSE/crypto).
const isAligned = (byTf) => { const tfs = tfsFor(Object.values(byTf)[0]); return tfs.every(tf => byTf[tf]) && new Set(tfs.map(tf => byTf[tf].direction)).size === 1; };

// Market filter for any asset-like object (a watch, or a basket pick with
// its watch's tag/large_cap when available).
// Market filter plus the search box (ticker or name, anywhere, any case).
function marketMatch(a, f = F) {
  if (f.q && !`${a.ticker} ${a.display_name || ''}`.toLowerCase().includes(f.q)) return false;
  if (f.market === 'all') return true;
  if (!marketsOf(a).has(f.market)) return false;
  return !(LARGE_CAP_MARKETS.includes(f.market) && f.large) || !!a.large_cap;
}

// ---------------------------------------------------------------------------
// Basket — hand-picked (asset, higher tf) setups in the repo's basket.json.
// Read via the GitHub API; written with a fine-grained token kept only in
// this browser. The workflows read the same file.
// ---------------------------------------------------------------------------
let basketPicks = [];      // as last read from GitHub
let basketStatus = {};     // per-pick lower-tf status from the last hourly scan
let repaintBasketButton = () => {};

async function fetchBasket() {
  const resp = await fetch(BASKET_API, { headers: ghHeaders(), cache: 'no-store' });
  if (resp.status === 404) return { picks: [], sha: null };
  if (!resp.ok) throw new Error(`GitHub ${resp.status}`);
  const file = await resp.json();
  return { picks: JSON.parse(b64decode(file.content)).picks || [], sha: file.sha };
}

// Read-modify-write against the file's current sha; a 409 means a workflow
// (e.g. an auto-removal) wrote in between — redo it on top.
async function updateBasket(mutate, message) {
  if (!getToken()) throw new Error('no token');
  for (let attempt = 0; attempt < 3; attempt++) {
    const { picks, sha } = await fetchBasket();
    const next = mutate(picks.slice());
    const body = { message, content: b64encode(JSON.stringify({ picks: next }, null, 2) + '\n') };
    if (sha) body.sha = sha;
    const resp = await fetch(BASKET_API, { method: 'PUT', headers: { ...ghHeaders(), 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
    if (resp.status === 409 || resp.status === 422) continue;
    if (resp.status === 401) throw new Error('token rejected or expired — check basket settings');
    if (resp.status === 403 || resp.status === 404) throw new Error("token can't write to this repo — it needs Contents: Read and write on ov-scanner");
    if (!resp.ok) throw new Error(`GitHub ${resp.status}`);
    basketPicks = next;
    return;
  }
  throw new Error('basket changed repeatedly, try again');
}

const inBasket = (key) => basketPicks.some(p => pickKey(p) === key);

// The one add/remove path for the header button, rows and basket list.
async function toggleBasket(pick) {
  const key = pickKey(pick), removing = inBasket(key);
  await updateBasket(picks => removing
    ? picks.filter(p => pickKey(p) !== key)
    : picks.filter(p => pickKey(p) !== key).concat([{
        asset_class: pick.asset_class, ticker: pick.ticker, display_name: pick.display_name,
        higher_tf: pick.higher_tf, direction: pick.direction, added_at: new Date().toISOString(),
        ...(isS50(pick) ? { setup: 'sma50' } : {}),
      }]),
    `Basket: ${removing ? 'remove' : 'add'} ${pick.display_name} ${pick.higher_tf}${isS50(pick) ? ' SMA 50' : ''}`);
  refreshBasketViews();
  return removing ? 'removed' : 'added';
}

// Mute / unmute one lower tf of a pick: still evaluated and shown, never alerted.
async function toggleMute(pick, ltf) {
  const key = pickKey(pick);
  const muted = new Set(pick.muted || []);
  muted.has(ltf) ? muted.delete(ltf) : muted.add(ltf);
  await updateBasket(picks => picks.map(p => pickKey(p) === key ? { ...p, muted: [...muted] } : p),
    `Basket: ${muted.has(ltf) ? 'mute' : 'unmute'} ${pick.display_name} ${pick.higher_tf}${isS50(pick) ? ' SMA 50' : ''} ${ltf}`);
  refreshBasketViews();
}

// Entry lines per pick (LSMA, SMA 50 or both); at least one stays on.
const PICK_LINES = [['lsma', 'LSMA'], ['sma50', 'SMA 50']];
const linesOf = (p) => { const l = PICK_LINES.map(([k]) => k).filter(k => (p.lines || []).includes(k)); return l.length ? l : isS50(p) ? ['sma50', 'lsma'] : ['lsma']; };

async function toggleLine(pick, line) {
  const key = pickKey(pick), lines = new Set(linesOf(pick));
  lines.has(line) ? lines.delete(line) : lines.add(line);
  if (!lines.size) return;
  const list = PICK_LINES.map(([k]) => k).filter(k => lines.has(k));
  await updateBasket(picks => picks.map(p => pickKey(p) === key ? { ...p, lines: list } : p),
    `Basket: ${pick.display_name} ${pick.higher_tf}${isS50(pick) ? ' SMA 50' : ''} entry on ${list.map(k => k === 'lsma' ? 'LSMA' : 'SMA 50').join(' + ')}`);
  refreshBasketViews();
}

function refreshBasketViews() {
  renderBasket();
  repaintBasketButton();
  document.querySelectorAll('#watchlist .row').forEach(paintRow);
}

const STATE_TEXT = {
  waiting: ['waiting', 'Waiting for a pullback past the LSMA'],
  pulled_back: ['pulled back', "Pulled back past the LSMA — MACD hasn't followed yet"],
  armed: ['armed', 'Pulled back + MACD followed — the next break alerts'],
  done: ['✓', 'Fired its one entry'],
  no_data: ['no data', "Couldn't fetch this timeframe on the last check"],
};

// A pick's watch (for its market tag / large-cap flag / charts), if still on.
const watchOf = (p) => assetsById[`${p.asset_class}__${p.ticker}__${slotOf(p)}`];

function basketPickVisible(p) {
  const w = watchOf(p);
  if (!marketMatch(w || p)) return false;
  if (F.tf === 'ALIGNED') { const byTf = watchesBySym[symKey(p)]; if (!byTf || !isAligned(byTf)) return false; }
  else if (F.tf !== 'ALL' && p.higher_tf !== F.tf) return false;
  return (F.dir === 'ALL' || p.direction === F.dir) && setupMatch(p);
}

function renderBasket() {
  const el = document.getElementById('basketList');
  document.getElementById('bkCount').textContent = basketPicks.length;
  if (!basketPicks.length) {
    el.innerHTML = `<div class="empty">No picks yet. Tap <strong>+</strong> on a watchlist row to add its timeframe — its lower timeframes are then watched for your entry, with a Discord alert when it fires.</div>`;
    return;
  }
  const shown = basketPicks.filter(basketPickVisible);
  if (!shown.length) { el.innerHTML = `<div class="empty">${F.q ? `No basket pick matches "${esc(F.q)}".` : 'No basket picks match these filters.'}</div>`; return; }
  el.innerHTML = shown.map(p => {
    const key = pickKey(p), w = watchOf(p), st = basketStatus[key], muted = new Set(p.muted || []);
    const name = w ? w.display_name : p.display_name, tag = w && w.tag && p.asset_class !== 'pse' ? w.tag : '';
    const s50 = isS50(p);
    const sub = s50
      ? `<div class="bk-sub"><span class="s50-tag">SMA 50</span>${w ? ` · ${w.candles_left} of ${w.life} candles left` : ''}</div>`
      : '<div class="bk-sub">trend</div>';
    let body;
    if (!w) {
      body = `<div class="bk-gone">${s50 ? 'SMA 50 watch ended' : 'off the watchlist'} — being removed</div>`;
    } else {
      // One row per lower tf: its latest activity only (full history is on
      // the lower-tf charts), and a switch for its alerts.
      const lines = linesOf(p), multi = lines.length > 1 || lines[0] !== 'lsma';
      const linesRow = `<div class="bk-lines"><span>entry on</span>${PICK_LINES.map(([k, l]) =>
        `<button type="button" class="ln-chip" data-line="${k}" aria-pressed="${lines.includes(k)}" title="${lines.includes(k) ? (lines.length > 1 ? `Stop entries on the ${l}` : 'At least one line stays on') : `Also enter on the ${l}`}">${l}</button>`).join('')}</div>`;
      body = linesRow + `<div class="bk-ltfs">${LOWER_TF_MAP[p.higher_tf].map(ltf => {
        const s = st && st[ltf], on = !muted.has(ltf);
        let status = '<span class="st-pending" title="Status appears after the next hourly scan">pending</span>';
        if (s && multi) {
          // One status per chosen line — L = LSMA, S = SMA 50. SMA 50 picks
          // fire once per line; trend picks re-arm after each entry.
          status = ['lsma', 'sma50'].filter(line => lines.includes(line)).map(line => {
            const x = (s.lines || {})[line], k = line === 'lsma' ? 'L' : 'S';
            if (!x) return `<span class="st-pending" title="Status appears after the next check">${k} pending</span>`;
            const entered = x.last_entry && (x.state === 'done' || (!s50 && x.state === 'waiting'));
            return entered
              ? `<span class="st-done" title="Latest entry on the ${line === 'lsma' ? 'LSMA' : 'SMA 50'}">${k} ✓ ${fmtTime(x.last_entry)}</span>`
              : `<span class="st-${x.state}" title="${esc((STATE_TEXT[x.state] || [x.state, ''])[1])}">${k} ${(STATE_TEXT[x.state] || [x.state])[0]}</span>`;
          }).join(' <span class="st-pending">·</span> ');
        } else if (s && !s.lines) {
          const last = (s.events || []).at(-1);
          if (s.state === 'waiting' && last && last.type === 'entry') status = `<span class="st-entry" title="Latest entry — waiting for the next pullback">✓ ${fmtTime(last.time)}</span>`;
          else { const [text, tip] = STATE_TEXT[s.state] || [s.state, '']; status = `<span class="st-${s.state}" title="${esc(tip)}">${text}</span>`; }
        }
        return `<span class="k${on ? '' : ' off'}">${ltf}</span><span class="${on ? '' : 'off'}">${on ? status : 'off'}</span>`
          + `<button class="tgl" type="button" role="switch" aria-checked="${on}" data-ltf="${ltf}" aria-label="${ltf} alerts" title="${on ? 'Alerts on — switch off' : 'Alerts off — switch on'}"></button>`;
      }).join('')}</div>`;
    }
    return `
      <div class="bk" data-key="${esc(key)}" data-id="${w ? w._id : ''}" title="${p.asset_class === 'crypto' ? 'Checked every 5 minutes' : p.asset_class === 'pse' ? 'Checked every 5 minutes during PSE hours' : 'Checked hourly'}">
        <div class="bk-head">
          <span><span class="sym">${esc(name)}</span>${tag ? `<span class="tag">${tag}</span>` : ''}<span class="bk-htf ${dirClass(p.direction)}">${p.higher_tf}${dirArrow(p.direction)}</span></span>
          <button class="bk-x" type="button" aria-label="Remove ${esc(name)} ${p.higher_tf}${s50 ? ' SMA 50' : ''} from the basket" title="Remove from the basket">×</button>
        </div>
        ${sub}
        ${body}
        <div class="bk-msg"></div>
      </div>`;
  }).join('') + `<div class="hint">switch a timeframe off to stop its alerts</div>`;

  el.querySelectorAll('.bk').forEach(card => {
    const pick = basketPicks.find(p => pickKey(p) === card.dataset.key);
    if (card.dataset.id) card.addEventListener('click', () => selectAsset(card.dataset.id));
    const say = (t) => { card.querySelector('.bk-msg').textContent = t; };
    card.querySelector('.bk-x').addEventListener('click', async (e) => {
      e.stopPropagation();
      if (!requireToken()) return;
      e.currentTarget.disabled = true; say('removing…');
      try { await toggleBasket(pick); } catch (err) { say(`Couldn't remove: ${err.message}`); }
    });
    card.querySelectorAll('.ln-chip').forEach(b => b.addEventListener('click', async (e) => {
      e.stopPropagation();
      if (linesOf(pick).length === 1 && linesOf(pick)[0] === b.dataset.line) { say('At least one entry line stays on.'); return; }
      if (!requireToken()) return;
      b.disabled = true;
      try { await toggleLine(pick, b.dataset.line); } catch (err) { say(`Couldn't save: ${err.message}`); b.disabled = false; }
    }));
    card.querySelectorAll('.tgl').forEach(sw => sw.addEventListener('click', async (e) => {
      e.stopPropagation();
      if (!requireToken()) return;
      sw.disabled = true;
      try { await toggleMute(pick, sw.dataset.ltf); } catch (err) { say(`Couldn't save: ${err.message}`); sw.disabled = false; }
    }));
  });
  const open = document.querySelector('#detail [data-current-id]');
  const openId = open && open.dataset.currentId;
  el.querySelectorAll('.bk').forEach(c => c.classList.toggle('active', !!openId && c.dataset.id === openId));
}

// Watchlist
// ---------------------------------------------------------------------------
// Which of an asset's watches a row opens/summarises: among those matching
// the tf/direction filters, the one that triggered most recently.
function primaryWatch(byTf, f = F) {
  if (f.tf === 'ALIGNED' && !isAligned(byTf)) return null;
  const candidates = Object.values(byTf).filter(w =>
    (f.tf === 'ALL' || f.tf === 'ALIGNED' || w.higher_tf === f.tf)
    && (f.dir === 'ALL' || w.direction === f.dir) && setupMatch(w, f));
  candidates.sort((x, y) => x.candles_ago_most_recent - y.candles_ago_most_recent || isS50(x) - isS50(y));
  return candidates[0] || null;
}

// Row = one asset. data-slot is the watch it shows: its RSI, its + / ✓, and
// the boldest of the timeframe labels. Triggered tfs are coloured, others
// grey; a dashed box marks an SMA 50 watch; a gold underline marks a tf
// with a watch in the basket.
function paintRow(row) {
  const byTf = watchesBySym[row.dataset.sym], w = byTf && byTf[row.dataset.slot];
  if (!w) return;
  row.dataset.id = w._id;
  const rsi = row.querySelector('.rsi');
  rsi.textContent = w.last_rsi ?? w.rsi_at_trigger;
  rsi.className = `rsi ${dirClass(w.direction)}`;
  row.querySelectorAll('.tfs [data-tf]').forEach(m => {
    m.classList.toggle('shown', m.dataset.tf === w.higher_tf);
    m.classList.toggle('in-basket', [m.dataset.tf, `${m.dataset.tf}:50`].some(k => byTf[k] && inBasket(pickKey(byTf[k]))));
  });
  const plus = row.querySelector('.plus'), inB = inBasket(pickKey(w));
  const label = `${w.higher_tf}${isS50(w) ? ' SMA 50' : ''}`;
  plus.classList.toggle('in', inB);
  plus.textContent = inB ? '✓' : '+';
  plus.title = inB ? `In the basket (${label}) — tap to remove` : `Add ${w.display_name} ${label} to the basket`;
  plus.setAttribute('aria-label', plus.title);
}

// A removed watch passes the same filters (never "aligned" — it's gone).
const removedMatch = (r) => marketMatch(r) && (F.tf === 'ALL' || F.tf === r.higher_tf)
  && (F.dir === 'ALL' || r.direction === F.dir) && setupMatch(r);

function applyFilters() {
  let visible = 0;
  document.getElementById('watchlist').classList.toggle('searching', !!F.q);
  document.querySelectorAll('#watchlist .grp-block').forEach(block => {
    let rows = 0, nNew = 0, up = 0, down = 0;
    block.querySelectorAll('.row').forEach(row => {
      const byTf = watchesBySym[row.dataset.sym];
      const w = marketMatch(Object.values(byTf)[0]) ? primaryWatch(byTf) : null;
      row.style.display = w ? '' : 'none';
      if (!w) return;
      rows++; nNew += row.dataset.isNew === '1';
      up += row.dataset.newDir === 'BULLISH'; down += row.dataset.newDir === 'BEARISH';
      row.dataset.slot = slotOf(w);
      paintRow(row);
    });
    visible += rows;
    block.style.display = rows ? '' : 'none';
    block.querySelector('.grp-n').textContent = block.dataset.older ? `${rows} ${rows === 1 ? 'asset' : 'assets'}` : `${nNew} new`;
    const dir = block.querySelector('.grp-dir');
    if (dir) dir.innerHTML = `<span class="bullish">▲${up}</span><span class="bearish">▼${down}</span>`;
  });
  document.getElementById('wlCount').textContent = visible;
  document.getElementById('wlEmpty').textContent = visible ? '' : (F.q ? `No match for "${F.q}".` : 'No assets match these filters.');
  updateCounts();
  renderBasket();
  renderRemoved();
}

// Removed tab: watches removed in the last 24 h, grouped by the scan that
// removed them, newest first. A row opens the asset if it still has
// another watch.
function renderRemoved() {
  const el = document.getElementById('removedList'), all = Object.values(removedBySym).flat();
  document.getElementById('rmCount').textContent = all.length;
  const shown = all.filter(removedMatch);
  if (!shown.length) {
    el.innerHTML = `<div class="empty">${!all.length ? 'Nothing removed in the last 24 hours.' : F.q ? `No removed watch matches "${esc(F.q)}".` : 'No removed watches match these filters.'}</div>`;
    return;
  }
  const groups = new Map();
  shown.forEach(r => { const b = scanOf(r.removed_at); if (!groups.has(b)) groups.set(b, []); groups.get(b).push(r); });
  const order = (r) => [GROUP_ORDER.indexOf(r.asset_class), r.display_name || r.ticker];
  const byOrder = (x, y) => { const [p, q] = [order(x), order(y)]; return p[0] - q[0] || String(p[1]).localeCompare(String(q[1])); };
  el.innerHTML = [...groups.keys()].sort((x, y) => x - y).map(b => `
    <div class="grp-block">
      <div class="grp"><span><span class="when">${b === OLDER ? 'EARLIER' : batchLabel(scanList[b].min).toUpperCase()}</span> · ${groups.get(b).length} removed</span></div>
      ${groups.get(b).sort(byOrder).map(r => {
        const live = Object.values(watchesBySym[symKey(r)] || {});
        const open = live.find(w => w.higher_tf === r.higher_tf) || live[0];
        const tag = r.tag && r.asset_class !== 'pse' ? `<span class="tag">${esc(r.tag)}</span>` : '';
        const still = live.length ? ` · <span class="on">still on ${[...new Set(live.map(w => w.higher_tf))].join(' ')}</span>` : '';
        return `
        <div class="row${open ? '' : ' gone'}" data-id="${open ? open._id : ''}" title="${open ? 'Open its remaining watch' : 'No watch left on this asset'}">
          <div class="row-name"><span class="sym">${esc(r.display_name || r.ticker)}</span>${tag}</div>
          <div class="tfs"><span class="rm${isS50(r) ? ' s50' : ''}">${r.higher_tf}${dirArrow(r.direction)}</span></div>
          <span></span>
          <div class="row-why">${isS50(r) ? 'SMA 50 · ' : ''}${esc(r.reason)}${still}</div>
        </div>`;
      }).join('')}
    </div>`).join('');
  el.querySelectorAll('.row[data-id]:not([data-id=""])').forEach(row => row.addEventListener('click', () => selectAsset(row.dataset.id)));
}

// Each filter's counts reflect the other filters' current choices, e.g.
// with PSE selected the tf and direction counts cover PSE only.
function updateCounts() {
  const syms = Object.values(watchesBySym);
  const n = (over) => { const f = { ...F, ...over }; return syms.filter(byTf => marketMatch(Object.values(byTf)[0], f) && primaryWatch(byTf, f)).length; };
  document.querySelectorAll('#filters button[data-group] .n').forEach(el => {
    const { group, value } = el.parentElement.dataset;
    const count = n(group === 'market' ? { market: value, large: false } : { [group]: value });
    el.textContent = count;
    if (group === 'market') el.parentElement.classList.toggle('zero', count === 0);
  });
  if (LARGE_CAP_MARKETS.includes(F.market)) document.querySelector('#largeCaps .n').textContent = n({ large: true });
}

// Direction and setup are toggles: tap one to show only it, tap it again
// to show both. Market and timeframe always have exactly one choice.
const TOGGLE_GROUPS = ['dir', 'setup'];

function buildFilters(syms) {
  // Counts are filled in by updateCounts().
  const btn = (cls, group, value, label) => `<button class="${cls}" type="button" data-group="${group}" data-value="${value}">${label}<span class="n"></span></button>`;
  document.getElementById('marketTabs').innerHTML = MARKETS.map(([v, l]) => btn('mkt', 'market', v, l)).join('');
  document.getElementById('tfSeg').innerHTML = [['ALL', 'all tf'], ['1H', '1H'], ['4H', '4H'], ['1D', '1D'], ['1W', '1W'], ['ALIGNED', 'aligned']]
    .map(([v, l]) => btn('opt', 'tf', v, l)).join('');
  document.getElementById('dirSeg').innerHTML = [['BULLISH', '<span class="bullish">▲</span>'], ['BEARISH', '<span class="bearish">▼</span>']]
    .map(([v, l]) => btn('opt', 'dir', v, l)).join('');
  document.getElementById('setupSeg').innerHTML = [['trend', 'trend'], ['sma50', 'SMA 50']]
    .map(([v, l]) => btn('opt', 'setup', v, l)).join('');

  const paint = () => {
    document.querySelectorAll('#filters button[data-group]').forEach(b => {
      const on = F[b.dataset.group] === b.dataset.value;
      b.classList.toggle('on', on);
      b.setAttribute('aria-pressed', on);
    });
    const lc = document.getElementById('largeCaps');
    document.getElementById('lcWrap').classList.toggle('is-hidden', !LARGE_CAP_MARKETS.includes(F.market));
    lc.classList.toggle('on', F.large);
    lc.setAttribute('aria-pressed', F.large);
  };
  paint();
  document.querySelectorAll('#filters button[data-group]').forEach(b => b.addEventListener('click', () => {
    const { group, value } = b.dataset;
    F[group] = TOGGLE_GROUPS.includes(group) && F[group] === value ? 'ALL' : value;
    if (group === 'market') F.large = false;
    paint();
    applyFilters();
  }));
  document.getElementById('largeCaps').addEventListener('click', () => {
    F.large = !F.large;
    paint();
    applyFilters();
  });
}

// Batches: each row sits under the scan that found its newest watch (the
// removed tab groups by the scan that removed). A run stamps everything it finds with its
// start, so each distinct stamp is its own scan (two runs can be minutes
// apart). Watches from before run stamps existed were stamped as each
// asset was scanned, so those times within 40 minutes count as one scan.
const RUN_STAMPS_FROM = Date.parse('2026-10-01T03:46:00Z');
const SCAN_GAP_MS = 40 * 60e3, OLDER_MS = 48 * 3600e3, OLDER = Infinity;

function batchLabel(ms) {
  const d = new Date(ms), day = new Date(d).setHours(0, 0, 0, 0), today = new Date().setHours(0, 0, 0, 0);
  const time = d.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });
  const date = day === today ? 'today' : day === today - 864e5 ? 'yesterday' : d.toLocaleDateString([], { month: 'short', day: 'numeric' });
  return `${date} ${time}`;
}

const msOf = (iso) => iso ? parseTime(iso).getTime() : 0;
let scanList = [];           // newest first: { max, min } in ms
let scanOf = () => OLDER;    // ISO time -> index in scanList, or OLDER

function buildScans() {
  scanList = [];
  const times = [...Object.values(assetsById).map(w => msOf(w.first_seen)), ...Object.values(removedBySym).flat().map(r => msOf(r.removed_at))];
  [...new Set(times)].sort((x, y) => y - x).forEach(t => {
    const s = scanList.at(-1);
    if (s && t < RUN_STAMPS_FROM && s.max < RUN_STAMPS_FROM && s.max - t <= SCAN_GAP_MS) s.min = t;
    else scanList.push({ max: t, min: t });
  });
  const cutoff = Date.now() - OLDER_MS;
  scanOf = (iso) => { const t = msOf(iso), i = scanList.findIndex(s => t >= s.min && t <= s.max); return i < 0 || scanList[i].min < cutoff ? OLDER : i; };
}

function buildWatchlist() {
  buildScans();
  const keys = Object.keys(watchesBySym);
  const live = (k) => Object.values(watchesBySym[k]);

  const batches = new Map();
  keys.forEach(k => {
    const b = Math.min(...live(k).map(w => scanOf(w.first_seen)));
    if (!batches.has(b)) batches.set(b, []);
    batches.get(b).push(k);
  });
  const order = (k) => { const a = live(k)[0]; return [GROUP_ORDER.indexOf(a.asset_class), a.display_name || a.ticker]; };
  const byOrder = (x, y) => { const [p, q] = [order(x), order(y)]; return p[0] - q[0] || String(p[1]).localeCompare(String(q[1])); };

  const row = (k, b) => {
    const byTf = watchesBySym[k], a = live(k)[0];
    const tfs = tfsFor(a).map(tf => {
      const t = byTf[tf], s = byTf[`${tf}:50`], w = t || s, m = macdAttrs(a, tf);
      const macd = (MACD_STATE[(a.macd_state || {})[tf]] || [])[1];
      if (!w) return `<span class="off"${m}${macd ? ` title="${tf}: ${macd}"` : ''}>${tf}</span>`;
      const nw = b !== OLDER && [t, s].some(x => x && scanOf(x.first_seen) === b);
      const title = `Open ${tf}${t && s ? ' (trend + SMA 50 watch)' : s ? ' SMA 50 watch' : ''}${nw ? ' · new this batch' : ''}${macd ? ` · ${macd}` : ''}`;
      return `<button type="button" class="${dirClass(w.direction)}${s ? ' s50' : ''}${nw ? ' nw' : ''}" data-tf="${tf}"${m} title="${title}">${tf}${dirArrow(w.direction)}</button>`;
    }).join('');
    const tag = a.tag && a.asset_class !== 'pse' ? `<span class="tag">${a.tag}</span>` : '';
    // The new watch that put the row here (most recent trigger if several).
    const fresh = b === OLDER ? [] : live(k).filter(w => scanOf(w.first_seen) === b).sort((x, y) => x.candles_ago_most_recent - y.candles_ago_most_recent);
    const isNew = fresh.length > 0;
    return `
        <div class="row" data-sym="${esc(k)}" data-is-new="${isNew ? 1 : 0}" data-new-dir="${isNew ? fresh[0].direction : ''}">
          <div class="row-name"><span class="sym">${esc(a.display_name || a.ticker)}</span>${tag}<span class="rsi"></span></div>
          <div class="tfs">${tfs}</div>
          <button type="button" class="plus"></button>
        </div>`;
  };

  // The latest scan's changes, above the list; "removed" opens that tab.
  const since = runStarted ? msOf(runStarted) : null;
  const nNew = since ? Object.values(assetsById).filter(w => msOf(w.first_seen) >= since).length : 0;
  const nRm = since ? Object.values(removedBySym).flat().filter(r => msOf(r.removed_at) >= since).length : 0;
  const sum = `
    <div class="wl-sum">
      <span title="Changes in the latest scan">${since ? `<span class="new">+${nNew} new</span> · <button type="button" class="rmb" title="Open the removed tab">−${nRm} removed</button>` : ''}</span>
      <span>PSE <span class="session${pseOpen() ? ' open' : ''}">${pseOpen() ? 'open' : 'closed'}</span></span>
    </div>`;

  const el = document.getElementById('watchlist');
  el.innerHTML = sum + [...batches.keys()].sort((x, y) => x - y).map((b, i) => {
    const older = b === OLDER;
    return `
    <div class="grp-block${i === 0 && !older ? ' latest' : ''}${older && olderFolded ? ' folded' : ''}"${older ? ' data-older="1"' : ''}>
      <div class="grp${older ? ' grp-fold' : ''}"><span><span class="when">${older ? 'OLDER' : batchLabel(scanList[b].min).toUpperCase()}</span> · <span class="grp-n"></span></span>${older ? `<span class="fold-ic">${olderFolded ? '▸' : '▾'}</span>` : '<span class="grp-dir"></span>'}</div>
      ${batches.get(b).sort(byOrder).map(k => row(k, b)).join('')}
    </div>`;
  }).join('') + '<div class="empty" id="wlEmpty"></div>';

  const fold = el.querySelector('.grp-fold');
  if (fold) fold.addEventListener('click', () => {
    olderFolded = !olderFolded;
    fold.parentElement.classList.toggle('folded', olderFolded);
    fold.querySelector('.fold-ic').textContent = olderFolded ? '▸' : '▾';
  });
  const rmb = el.querySelector('.rmb');
  if (rmb) rmb.addEventListener('click', () => document.querySelector('.panel-tab[data-view="removed"]').click());

  el.querySelectorAll('.row').forEach(row => {
    row.addEventListener('click', () => selectAsset(row.dataset.id));
    row.querySelectorAll('.tfs button').forEach(m => m.addEventListener('click', (e) => {
      e.stopPropagation();
      const byTf = watchesBySym[row.dataset.sym], t = byTf[m.dataset.tf], s = byTf[`${m.dataset.tf}:50`];
      selectAsset(((F.setup === 'sma50' || !t) ? s : t)._id);
    }));
    row.querySelector('.plus').addEventListener('click', async (e) => {
      e.stopPropagation();
      if (!requireToken()) return;
      const btn = e.currentTarget, w = watchesBySym[row.dataset.sym][row.dataset.slot];
      btn.disabled = true; btn.textContent = '…';
      try { await toggleBasket(w); }
      catch (err) { alert(`Couldn't save the basket: ${err.message}`); }
      finally { btn.disabled = false; paintRow(row); }
    });
  });
}

// ---------------------------------------------------------------------------
// Asset view
// ---------------------------------------------------------------------------
function selectAsset(id) {
  const entry = assetsById[id];
  if (!entry) return;
  document.querySelectorAll('#watchlist .row').forEach(row => {
    const isOpen = row.dataset.sym === symKey(entry);
    row.classList.toggle('active', isOpen);
    if (isOpen && row.dataset.slot !== slotOf(entry)) { row.dataset.slot = slotOf(entry); paintRow(row); }
  });
  document.querySelectorAll('#basketList .bk').forEach(c => c.classList.toggle('active', c.dataset.id === id));
  teardownCharts();
  plan = null; planCharts = [];

  const direction = entry.direction, dc = dirClass(direction);
  const siblings = watchesBySym[symKey(entry)] || {};
  const cycleStatus = basketStatus[pickKey(entry)] || null;
  const lowerTfs = Object.keys(entry.lower_tf_candles || {});
  const s50 = isS50(entry);
  const tfSwitch = tfsFor(entry).map(tf => {
    // Same setup as the open watch where the tf has it, else the other one.
    const t = siblings[tf], s = siblings[`${tf}:50`], w = (s50 ? s || t : t || s);
    if (!w) return `<span class="tf-sw off" title="Not on watch on ${tf}">${tf}</span>`;
    return `<button class="tf-sw ${dirClass(w.direction)}${s ? ' s50' : ''}${tf === entry.higher_tf ? ' current' : ''}" type="button" data-id="${w._id}">${tf}${dirArrow(w.direction)}</button>`;
  }).join('');
  const other = siblings[s50 ? entry.higher_tf : `${entry.higher_tf}:50`];
  const setupSw = other
    ? `<span class="setup-sw">${[[s50 ? other : entry, 'trend'], [s50 ? entry : other, 'SMA 50']].map(([w, l]) =>
        `<button type="button" data-id="${w._id}" class="${w === entry ? 'current' : ''}">${l}</button>`).join('')}</span>`
    : '';
  const sub = entry.asset_class === 'pse' ? 'PSE' : (entry.tag || (entry.ticker !== entry.display_name ? entry.ticker : ''));
  const ago = entry.candles_ago_most_recent;
  const noLsma = entry.higher_tf === '1W';
  const summary = s50
    ? `${entry.higher_tf} <span class="${dc}">${dc}</span> <span class="s50-tag">SMA 50</span> pullback · removed ${fmtTime(entry.removed_at)} (close past EMA20) · touched SMA 50 ${entry.touch_gap ? `${entry.touch_gap} ${entry.touch_gap === 1 ? 'candle' : 'candles'} later` : 'on that candle'} · ${entry.candles_left} of ${entry.life} candles left`
    : `${entry.higher_tf} <span class="${dc}">${dc} continuation</span> · trend${noLsma ? '' : ' + LSMA'} + RSI ${direction === 'BULLISH' ? '&gt; 70' : '&lt; 30'} · ${entry.qualifying_count} of ${entry.window} qualified · last ${ago} ${ago === 1 ? 'candle' : 'candles'} ago`;

  const detail = document.getElementById('detail');
  detail.innerHTML = `
    <div class="d-top" data-current-id="${id}">
      <div><span class="d-name">${esc(entry.display_name)}</span>${sub ? `<span class="d-sub">${esc(sub)}</span>` : ''} <span class="rsi ${dc}">RSI ${entry.last_rsi ?? '—'}</span></div>
      <div class="d-right">${tfSwitch}</div>
    </div>
    <div class="d-summary">${summary}${setupSw}</div>
    <div class="d-actions"><button class="bk-btn" id="basketBtn" type="button"></button><button class="plan-btn is-hidden" id="planBtn" type="button" title="Click the entry, then the cut loss, on any chart below">plan trade</button><span class="msg" id="basketMsg"></span>${tradeNote(entry)}</div>
    <div class="plan-bar is-hidden" id="planBar"></div>

    <div class="legend">
      <span class="ind-label">show</span>${indicatorToggles()}
      <span class="push">ctrl+scroll or pinch to zoom · drag to pan</span>
    </div>
    <div class="chart-head"><span class="chart-label">${entry.higher_tf} <span class="dim">trigger timeframe</span></span><button class="reset" id="detail-chart-reset" type="button">reset zoom</button></div>
    <div class="chart-box" id="detail-chart"></div>
    <div class="macd-box" id="detail-macd"></div>
    <div class="price-line"><span id="detail-price">—</span><span id="detail-pct">—</span></div>

    <div class="section"><span>LOWER TIMEFRAMES</span>${cycleStatus ? `<span class="cy"><span style="color:var(--gold-bright)">●</span> pulled back &nbsp;<span style="color:var(--violet)">●</span> armed &nbsp;<span>${dirArrow(direction)}</span> entry${Object.values(cycleStatus).some(c => c && c.lines) ? ` (S = SMA 50, L = LSMA${s50 ? ' · first cross of each only' : ''})` : ''}</span>` : ''}</div>
    ${lowerTfs.map((ltf, li) => `
      <div class="chart-head"><span class="chart-label">${ltf}</span><button class="reset" id="detail-mini-${li}-reset" type="button">reset zoom</button></div>
      <div class="chart-box" id="detail-mini-${li}"></div>
      <div class="macd-box" id="detail-minimacd-${li}"></div>
    `).join('')}`;

  detail.querySelectorAll('.tf-sw[data-id], .setup-sw [data-id]').forEach(b => { if (b.dataset.id !== id) b.addEventListener('click', () => selectAsset(b.dataset.id)); });
  detail.querySelectorAll('.ind').forEach(b => b.addEventListener('click', () => setIndicator(b.dataset.key, !shown[b.dataset.key])));
  if (!shown.macd) detail.querySelectorAll('.macd-box').forEach(el => el.classList.add('is-hidden'));
  wireBasketButton(entry);

  const forex = marketsOf(entry).has('forex');
  const candles = toCandles(entry.candles);
  const trades = tradesFor(entry);
  addPlanChart(entry.higher_tf, renderBlock(candles, 'detail-chart', 'detail-macd', entry.window || 25,
    { forex, trades, triggers: { marks: entry.marks, times: entry.trigger_times || [], direction, s50: s50 ? entry : null } }));
  if (candles.length > 1) {
    const last = candles[candles.length - 1].close, first = candles[0].close;
    const pct = (last - first) / first * 100;
    document.getElementById('detail-price').textContent = last;
    const pctEl = document.getElementById('detail-pct');
    pctEl.textContent = `${pct >= 0 ? '+' : ''}${pct.toFixed(2)}%`;
    pctEl.className = pct >= 0 ? 'up' : 'down';
  }
  lowerTfs.forEach((ltf, li) => {
    const c = toCandles(entry.lower_tf_candles[ltf]);
    addPlanChart(ltf, renderBlock(c, `detail-mini-${li}`, `detail-minimacd-${li}`, c.length,
      { forex, trades, cycles: cycleStatus && cycleStatus[ltf] ? { events: cycleStatus[ltf].events, direction, s50: !!cycleStatus[ltf].lines } : null,
        triggers: (entry.lower_tf_marks || {})[ltf] ? { marks: entry.lower_tf_marks[ltf], times: [], direction } : null }));
  });
}

// ---------------------------------------------------------------------------
// Trade plan — for a basket pick: click the entry, then the cut loss, on
// any of its three charts; the target follows the ratio (1:1 default).
// Every line can then be dragged; dragging the target sets a custom ratio.
// Saved to trades.json — scanned for the fill, then TP / CL (trades.py),
// and followed on forward.html.
// ---------------------------------------------------------------------------
let tradesList = [];         // trades.json, as last read
let plan = null;             // { pick, step: 'entry'|'cl'|'adjust', entry, cl, tp, ratio, custom, tf, precision }
let planCharts = [];         // [{ tf, chart, series, el, precision, lines }]
const RATIOS = [1, 1.5, 2, 3];

const tradesFor = (a) => tradesList.filter(t => t.asset_class === a.asset_class && t.ticker === a.ticker && ['pending', 'open'].includes(t.status));
function tradeNote(a) {
  const n = tradesFor(a).length;
  return n ? `<span class="trade-note">· ${n} trade ${n === 1 ? 'plan' : 'plans'} on the charts · <a href="forward.html">forward test</a></span>` : '';
}

function addPlanChart(tf, h) {
  if (!h) return;
  const pc = { tf, ...h, lines: null };
  planCharts.push(pc);
  h.chart.subscribeClick(p => onPlanClick(pc, p));
  wirePlanDrag(pc);
}

const planSnap = (price) => snapPrice(price, plan.pick.asset_class, plan.precision);
const planTp = () => planSnap(plan.entry + plan.ratio * (plan.entry - plan.cl));

function onPlanClick(pc, p) {
  if (!plan || plan.step === 'adjust' || !p || !p.point) return;
  const raw = pc.series.coordinateToPrice(p.point.y);
  if (raw == null) return;
  if (plan.step === 'entry') {
    Object.assign(plan, { tf: pc.tf, precision: pc.precision });
    plan.entry = planSnap(raw); plan.step = 'cl';
  } else {
    const cl = planSnap(raw);
    if (cl === plan.entry) return;
    plan.cl = cl; plan.tp = planTp(); plan.step = 'adjust';
  }
  drawPlan(); paintPlanBar();
}

function drawPlan() {
  planCharts.forEach(pc => { pc.lines = tradeLines(pc.series, plan ? { entry: plan.entry, cl: plan.cl, tp: plan.tp } : {}, pc.lines); });
}
function clearPlan() {
  planCharts.forEach(pc => { Object.values(pc.lines || {}).forEach(l => pc.series.removePriceLine(l)); pc.lines = null; });
  plan = null; paintPlanBar();
}

// Drag a line (within a few px of it) once the plan has all three.
function wirePlanDrag(pc) {
  const el = pc.el, yOf = (e) => e.clientY - el.getBoundingClientRect().top;
  const near = (y) => {
    if (!plan || plan.step !== 'adjust') return null;
    let best = null, gap = 7;
    ['tp', 'entry', 'cl'].forEach(k => { const c = pc.series.priceToCoordinate(plan[k]); if (c != null && Math.abs(c - y) < gap) { gap = Math.abs(c - y); best = k; } });
    return best;
  };
  let drag = null;
  el.addEventListener('pointerdown', (e) => {
    const k = near(yOf(e)); if (!k) return;
    drag = k; e.preventDefault(); e.stopPropagation();
    el.setPointerCapture(e.pointerId);
    pc.chart.applyOptions({ handleScroll: false, handleScale: false });
  }, true);
  el.addEventListener('pointermove', (e) => {
    if (!drag) { el.style.cursor = near(yOf(e)) ? 'ns-resize' : ''; return; }
    e.stopPropagation();
    const p = pc.series.coordinateToPrice(yOf(e));
    if (p != null) movePlan(drag, planSnap(p));
  }, true);
  const end = () => { if (!drag) return; drag = null; pc.chart.applyOptions({ handleScroll: chartTheme.handleScroll, handleScale: chartTheme.handleScale }); };
  el.addEventListener('pointerup', end, true);
  el.addEventListener('pointercancel', end, true);
  ['mousedown', 'touchstart'].forEach(ev => el.addEventListener(ev, (e) => { if (drag) e.stopPropagation(); }, true));
}

function movePlan(k, price) {
  const long = plan.entry > plan.cl;
  if (k === 'tp') {
    if (long ? price <= plan.entry : price >= plan.entry) return;
    plan.tp = price; plan.ratio = Math.abs(price - plan.entry) / Math.abs(plan.entry - plan.cl); plan.custom = true;
  } else {
    const next = { ...plan, [k]: price };
    if (next.entry === next.cl) return;
    plan[k] = price; plan.tp = planTp();
  }
  drawPlan(); paintPlanBar();
}

function paintPlanBar() {
  const bar = document.getElementById('planBar');
  if (!bar) return;
  bar.classList.toggle('is-hidden', !plan);
  if (!plan) return;
  const pct = (v) => `${v >= plan.entry ? '+' : '−'}${Math.abs((v - plan.entry) / plan.entry * 100).toFixed(2)}%`;
  const px = (v) => plan.pick.asset_class === 'pse' ? String(v) : v.toFixed(plan.precision);
  const cancel = '<button class="text-btn" type="button" data-act="cancel">cancel</button>';
  if (plan.step === 'entry') bar.innerHTML = `<span><b>① click the entry</b> on any chart</span><span class="push">${cancel}</span>`;
  else if (plan.step === 'cl') bar.innerHTML = `<span>entry <b>${px(plan.entry)}</b> · <b>② click the cut loss</b></span><span class="push">${cancel}</span>`;
  else {
    const long = plan.entry > plan.cl, opts = RATIOS.map(r => `<option value="${r}"${!plan.custom && r === plan.ratio ? ' selected' : ''}>1:${r}</option>`).join('');
    bar.innerHTML = `<span><b class="${long ? 'bullish' : 'bearish'}">${long ? 'long' : 'short'}</b> on ${plan.tf} · entry <b>${px(plan.entry)}</b> · CL <b>${px(plan.cl)}</b> (${pct(plan.cl)}) · TP <b>${px(plan.tp)}</b> (${pct(plan.tp)})</span>
      <span>ratio <select data-act="ratio">${plan.custom ? `<option selected>1:${plan.ratio.toFixed(2)}</option>` : ''}${opts}</select></span>
      <span>drag a line to adjust · fills when price reaches the entry</span>
      <span class="push">${cancel}<button class="text-btn go" type="button" data-act="save">save plan</button></span><span class="msg" id="planMsg"></span>`;
  }
  bar.querySelector('[data-act="cancel"]').addEventListener('click', clearPlan);
  const ratio = bar.querySelector('[data-act="ratio"]');
  if (ratio) ratio.addEventListener('change', () => { const r = parseFloat(ratio.value); if (!RATIOS.includes(r)) return; plan.ratio = r; plan.custom = false; plan.tp = planTp(); drawPlan(); paintPlanBar(); });
  const save = bar.querySelector('[data-act="save"]');
  if (save) save.addEventListener('click', savePlan);
}

async function savePlan() {
  if (!requireToken()) return;
  const msg = document.getElementById('planMsg'), p = plan.pick, long = plan.entry > plan.cl;
  const pick = basketPicks.find(b => pickKey(b) === pickKey(p)) || p;
  const trade = {
    id: `${Date.now().toString(36)}${Math.random().toString(36).slice(2, 6)}`,
    asset_class: p.asset_class, ticker: p.ticker, display_name: p.display_name, tag: p.tag || null,
    higher_tf: p.higher_tf, setup: isS50(p) ? 'sma50' : 'trend', lines: linesOf(pick), pick_direction: p.direction,
    plan_tf: plan.tf, entry: plan.entry, cl: plan.cl, tp: plan.tp, ratio: +plan.ratio.toFixed(2),
    status: 'pending', created_at: new Date().toISOString(),
  };
  msg.textContent = 'saving…';
  try {
    tradesList = await updateTrades(list => list.concat([trade]), `Trades: plan ${p.display_name} ${long ? 'long' : 'short'} on ${plan.tf}`);
    plan = null;
    selectAsset(p._id);   // redraw with the saved plan's lines
  } catch (err) { msg.textContent = `Couldn't save: ${err.message}`; }
}

function wireBasketButton(entry) {
  const btn = document.getElementById('basketBtn'), msg = document.getElementById('basketMsg');
  const key = pickKey(entry);
  const planBtn = document.getElementById('planBtn');
  const paint = () => {
    btn.classList.toggle('in', inBasket(key));
    const label = `${entry.higher_tf}${isS50(entry) ? ' SMA 50' : ''}`;
    btn.textContent = inBasket(key) ? `✓ in basket (${label}) · remove` : `+ add ${label} to basket`;
    planBtn.classList.toggle('is-hidden', !inBasket(key));
  };
  planBtn.addEventListener('click', () => {
    clearPlan();
    plan = { pick: entry, step: 'entry', ratio: 1, custom: false };
    paintPlanBar();
  });
  paint();
  repaintBasketButton = paint;
  btn.addEventListener('click', async () => {
    if (!requireToken()) return;
    btn.disabled = true; msg.textContent = 'saving…';
    try { msg.textContent = (await toggleBasket(entry)) === 'removed' ? 'removed' : 'added — watched from the next check'; }
    catch (err) { msg.textContent = `Couldn't save: ${err.message}`; }
    finally { btn.disabled = false; paint(); }
  });
}

// ---------------------------------------------------------------------------
// Init
// ---------------------------------------------------------------------------
function wireSearch() {
  const input = document.getElementById('search'), clear = document.getElementById('searchClear');
  const set = (v) => {
    input.value = v;
    F.q = v.trim().toLowerCase();
    clear.classList.toggle('is-hidden', !v);
    if (Object.keys(watchesBySym).length) applyFilters();
  };
  input.addEventListener('input', () => set(input.value));
  input.addEventListener('keydown', (e) => { if (e.key === 'Escape') { set(''); input.blur(); } });
  clear.addEventListener('click', (e) => { e.preventDefault(); set(''); input.focus(); });
  // "/" jumps to the search box unless you're already typing somewhere.
  document.addEventListener('keydown', (e) => {
    if (e.key !== '/' || e.ctrlKey || e.metaKey || e.altKey || /^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement.tagName)) return;
    e.preventDefault(); input.focus(); input.select();
  });
}

async function init() {
  wireBasketSettings();
  wireSearch();
  document.querySelectorAll('.panel-tab').forEach(tab => tab.addEventListener('click', () => {
    document.querySelectorAll('.panel-tab').forEach(t => t.classList.toggle('active', t === tab));
    document.getElementById('watchlist').classList.toggle('is-hidden', tab.dataset.view !== 'watchlist');
    document.getElementById('basketList').classList.toggle('is-hidden', tab.dataset.view !== 'basket');
    document.getElementById('removedList').classList.toggle('is-hidden', tab.dataset.view !== 'removed');
  }));

  let data;
  try {
    // 'no-cache' = ask GitHub whether it changed: a new scan downloads, an
    // unchanged file comes from the browser cache (no 20+ MB re-download).
    const resp = await fetch('data.json', { cache: 'no-cache' });
    if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
    data = await resp.json();
  } catch (err) {
    document.querySelector('.layout').innerHTML = `
      <div class="load-error">
        <strong>Couldn't load data.json</strong> (${esc(err.message)}).<br><br>
        If you opened this file directly (<code>file://</code>), browsers block that fetch. Serve the folder over local HTTP instead:<br><br>
        <code>python -m http.server 8000</code> then open <code>http://localhost:8000/dashboard.html</code>.
      </div>`;
    return;
  }

  const assets = data.assets || [];
  basketStatus = data.basket_status || {};
  runStarted = data.run_started_at || null;
  removedBySym = {};
  (data.removed || []).forEach(r => (removedBySym[symKey(r)] = removedBySym[symKey(r)] || []).push(r));
  watchesBySym = {}; assetsById = {};
  assets.forEach(a => {
    a._id = `${symKey(a)}__${slotOf(a)}`;
    assetsById[a._id] = a;
    (watchesBySym[symKey(a)] = watchesBySym[symKey(a)] || {})[slotOf(a)] = a;
  });
  const syms = Object.values(watchesBySym);

  const scanTime = data.generated_at ? new Date(data.generated_at).toLocaleString([], { month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' }) : '—';
  document.getElementById('scanMeta').innerHTML = `scan <strong>${scanTime}</strong> · <strong>${syms.length}</strong> on watch`;

  buildFilters(syms);
  if (!assets.length) {
    document.getElementById('detail').innerHTML = '<div class="empty">Nothing on watch right now — no asset meets the trigger condition this scan.</div>';
    return;
  }
  buildWatchlist();
  applyFilters();

  fetchTrades()
    .then(list => {
      tradesList = list;
      const open = document.querySelector('#detail [data-current-id]');
      if (open && tradesFor(assetsById[open.dataset.currentId] || {}).length && !plan) selectAsset(open.dataset.currentId);
    })
    .catch(() => {});
  fetchBasket()
    .then(({ picks }) => { basketPicks = picks; refreshBasketViews(); })
    .catch(err => { document.getElementById('basketList').innerHTML = `<div class="empty">Couldn't load the basket (${esc(err.message)}).</div>`; });

  window.addEventListener('resize', () => activeCharts.forEach(({ chart, el }) => chart.applyOptions({ width: el.clientWidth })));

  const first = [...document.querySelectorAll('#watchlist .row:not([style*="none"])')].find(r => r.dataset.id);
  if (first) selectAsset(first.dataset.id);
}

init();
</script>
